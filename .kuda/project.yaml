purpose: project is the repo's project-memory layer — non-code artifacts (BACKLOG.md, DONE.md, TODO.md, ADRs, handoffs, issues) that kuda's own index treats as record corpora under the project module. Covers T-001…T-037 across backlog/done/todo, ADR-0001 tiered memory topology, ADR-0003 domain descriptors for record corpora, and handoffs I-002/T-001…T-009.
invariants:
- ADR-0001 (id ADR-0001, status open, priority med): Option C tiered index + query — L0 repo card always-load, L1 module cards on-demand, L2 symbol/dep graph queried; Option A rejected, Option B (embedding/RAG) deferred as future kuda-store adapter
- ADR-0001 proposal: every concern is a port + adapter crate (bupha topology) — extract (manifest|treesitter|lsp), summarize (template|llm), store (sqlite first), vcs (git), serve (cli|mcp); per-language knowledge = data in data/langs/* (new language = data change, not release); template summarizer is zero-model default; committed artifacts .kuda/index.yaml + .kuda/modules/*.yaml; gitignored .kuda/index.sqlite (rebuildable); provenance per card {files, content_hash, commit_sha} → kuda status = sha diff vs HEAD; cards end with verify: file lists
- ADR-0003 (id ADR-0003, status open, owner devin, created 2026-11-05, priority med; proposed, implemented on feat/domain-records): DomainDef descriptors in data/domains/* declare corpus roots, record-file extensions, module grouping, and regexes (record_patterns capture group 1 = record id; ref_pattern → EdgeKind::References edges); kuda-records adapter (kind "records", on by default, absent corpus = silent skip) turns descriptors into SymbolKind::Record symbols; find T-001 / card project / dependents ADR-0001 work on work-state corpora
