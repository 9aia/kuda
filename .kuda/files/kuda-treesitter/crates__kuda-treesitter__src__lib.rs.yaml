purpose: Treesitter adapter implementing the `kuda_extract::Extractor` port (`kind` = `"treesitter"`) — runs compiled grammar + query data over source files to produce `Symbol`s and `EdgeKind::Imports` dependency edges. Per-language knowledge lives in `data/langs/*` (grammar id, extensions, symbol/dep queries); the crate only executes queries against a grammar it has compiled in — "new language = data file + a `language()` arm."
