path: crates/kuda-treesitter/src/lib.rs
module: kuda-treesitter
purpose: Tree-sitter extractor adapter (kind `"treesitter"`) — runs per-language symbol and import queries from `LangDef` data over compiled grammars (rust, typescript/tsx, python, go) to emit symbols (capture suffix `@name.<kind>` → `SymbolKind`, 1-based lines) and `EdgeKind::Imports` edges (only `@dep` captures, skipping `self`/`crate`/`std`/`core`/`alloc`/`super` and relative imports via `dep_root`). Module identity comes from the nearest manifest dir mapped through `pkg_names` to the manifest extractor's package name (dir-name/`_root` fallbacks); supports incremental `extract_filtered`, skips excluded dirs and `.git`-file worktrees, ignores unknown grammars, and errors on invalid queries.
