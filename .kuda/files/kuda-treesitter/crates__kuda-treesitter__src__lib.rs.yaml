path: crates/kuda-treesitter/src/lib.rs
module: kuda-treesitter
purpose: Treesitter adapter implementing the `Extractor` port — compiles per-language grammar + queries (from `data/langs/*`, falling back to `DEFAULT_RUST_QUERY`) to produce symbols, import edges (`DepEdge`), and file lists from a repo walk. New language support requires only a data file plus a `language()` match arm; supports incremental extraction via `extract_filtered` which parses only a given set of repo-relative files.
