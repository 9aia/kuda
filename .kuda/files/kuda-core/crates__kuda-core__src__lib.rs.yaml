module: kuda-core
purpose: 'kuda''s domain core — integration-free types for the memory tiers (L0 `RepoCard`, L1 `ModuleCard`/`FileCard`, L2 `Symbol`/`DepEdge` graph), `Provenance` for computed staleness, `LangDef`/`DomainDef` descriptors that make new languages and record corpora data changes, and the `kuda.toml` config model with serde defaults and `deny_unknown_fields`. Also provides shared helpers: walk exclusions (`default_excludes`/`dir_excluded`), module-name canonicalization (`module_key`/`module_variants`), and language-aware dep-specifier reduction (`dep_root`).'
