path: crates/kuda-core/src/lib.rs
module: kuda-core
purpose: kuda-core holds the integration-free domain types for the tiered memory model (ADR-0001) — L0 `RepoCard`, L1 `ModuleCard`/`FileCard`, L2 `Symbol`/`DepEdge`, all stamped with `Provenance` (files, hashes, commit sha, generator) so staleness is computed, never assumed. It also defines the `kuda.toml` config model (`Config` and its `Repo`/`Extract`/`Summarize`/`Store`/`Cards`/`Workspace` sections with defaults), the data-driven `LangDef`/`DomainDef` descriptors, and walk helpers (`default_excludes`, `dir_excluded`, `module_key`).
