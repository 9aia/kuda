path: crates/kuda-core/src/lib.rs
module: kuda-core
purpose: Defines kuda’s integration-free domain model for provenance-bearing repository, module, and file cards, symbols, dependency edges, and language and record-corpus descriptors. It also models `kuda.toml`, including strict unknown-field rejection, extraction and summarization settings, storage and card paths, domain overrides, and workspace configuration. Defaults enable manifest, tree-sitter, and records extraction, deterministic template summaries, SQLite at `.kuda/index.sqlite`, committed cards under `.kuda`, and a shared set of walk exclusions.
