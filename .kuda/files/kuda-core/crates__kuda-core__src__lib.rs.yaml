purpose: 'I''ll read the file to verify the content before summarizing.purpose: `kuda-core` holds the domain types only — no ports, no integrations: the memory-tier cards (`RepoCard` L0, `ModuleCard`/`FileCard` L1), the `Symbol`/`DepEdge` graph types with `SymbolKind`/`EdgeKind` enums, `Provenance` (files/hashes/commit_sha/generator so drift is computed, never assumed), and the data descriptors `LangDef`/`DomainDef`. It also defines the `kuda.toml` config model (`Config` with `RepoCfg`/`ExtractCfg`/`SummarizeCfg`/`StoreCfg`/`CardsCfg`/`WorkspaceCfg`, all `deny_unknown_fields`), the walk-exclusion helpers (`default_excludes`, `dir_excluded`), and module-name canonicalization utilities (`module_key`, `module_variants`, `dep_root`) that fold dash/underscore spellings so cross-module edges resolve without false-empty dependents.'
