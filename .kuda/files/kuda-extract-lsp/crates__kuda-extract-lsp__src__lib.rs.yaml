path: crates/kuda-extract-lsp/src/lib.rs
module: kuda-extract-lsp
purpose: '`crates/kuda-extract-lsp/src/lib.rs` is the LSP adapter for symbol extraction — it spawns one language server per root (command from `extract.lsp_server`), speaks Content-Length-framed JSON-RPC over stdio (`initialize`/`initialized`, `textDocument/documentSymbol` per file, `workspace/symbol`+`textDocument/references` for references), and maps LSP `SymbolKind` ints to kuda''s `SymbolKind`. Missing or failing servers degrade to empty extraction so other extractors still run, and tests drive a stub LSP server via `$KUDA_LSP_MODE` scenarios.'
