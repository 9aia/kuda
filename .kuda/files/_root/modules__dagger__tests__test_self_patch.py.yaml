module: _root
purpose: Regression-test suite for the embedded `_SELF_PATCH_PY` script that ships inside a bash heredoc in `main.py`; it extracts the script via AST parsing, substitutes the same placeholders `_link_repo` uses, and runs it against fixture Cargo.toml files in tmp dirs. Tests verify that a `[patch."<url>"]` block is appended from the `repository` field or an overriding `patch_host`, that re-runs are idempotent, that stale rows and inner comments are stripped while surrounding tables/comments survive, that a missing repository and patch_host raises an error, and that no function in `main.py` forwards undeclared names.
