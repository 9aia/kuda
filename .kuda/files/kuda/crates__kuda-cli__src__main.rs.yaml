path: crates/kuda-cli/src/main.rs
module: kuda
purpose: 'Composition root of the kuda CLI: parses `kuda.toml` config, wires adapters (extractors, SQLite store, summarizer) behind ports, and dispatches clap subcommands (init, sync, status, map, card, find, dependents, refs, doctor, mcp, acp). It runs the incremental indexing pipeline (git-blob-hash freshness diff → extract → summarize → cards/store) and serves the index over MCP stdio and ACP JSON-RPC protocols.'
