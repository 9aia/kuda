purpose: 'I''ll read the file to verify the content before summarizing. Given its size (113 chunks), I''ll read the beginning to confirm the composition-root structure.purpose: Composition root of the `kuda` binary — parses `kuda.toml` via `TomlSource`, wires adapters behind ports (extract/store/summarize/vcs), and dispatches all subcommands (`init`, `sync`, `status`, `map`, `card`, `find`, `dependents`, `refs`, `watch`, `mcp`, `acp`, `doctor`, plus hidden `gen-cli-docs`). Embeds language and domain descriptors at compile time via `include_str!` (`LANG_TOMLS`, `DOMAIN_TOMLS`), computes in-process git blob hashes (sha1 of `"blob <len>\0"+bytes`, no subprocess) for provenance, and implements the shared repo walk (`scan_repo`) that groups manifests/sources/record-corpus files into modules and blob-hashes every file. Handles BrokenPipe gracefully in stdout emission and supports multi-root workspace sync with cross-root module-name resolution.'
