module: kuda
purpose: 'CLI composition root for kuda: parses `kuda.toml`, wires config/extract/store/summarize/VCS adapters, and dispatches subcommands (init, sync, status, map, card, find, dependents, refs, watch, mcp, acp, doctor, gen-cli-docs). Implements the incremental index pipeline — repo walk grouping files into modules by manifest dir or domain corpus, in-process git blob hashing for provenance, per-module summarization, and card/index persistence — plus workspace mode driven by `.kuda/workspace.yaml`.'
