path: crates/kuda-cli/tests/e2e.rs
module: kuda
purpose: End-to-end CLI test suite that drives the compiled `kuda` binary against temp-dir fixture repos (seeded python monorepos, git repos, hand-crafted `.kuda` cards) and asserts on stdout, exit codes, and generated files. Covers `init` scaffolding and error paths, `sync` (monorepo dependency edges, bounded module cards, stale file-card sweeping, incremental/deletion/full/upgrade paths, store failures, workspace mode, sturn WAL marks), `status` tree-digest drift detection, `map`/`card` hits and misses, SIGPIPE-safe output, `find` exact/fuzzy/miss, `dependents`, `refs` text/docs/LSP tiers with fallback, `doctor`, docs generation, bad config, and ACP stub behavior.
