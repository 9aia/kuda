purpose: 'I''ll read the file to verify the content before summarizing.purpose: End-to-end CLI test suite that drives the compiled `kuda` binary (`CARGO_BIN_EXE_kuda`) against temp-dir fixture repos, asserting on stdout/stderr, exit codes, and generated `.kuda/` artifacts. Covers the full command surface — help/init scaffolding, sync (monorepo dash/underscore edge resolution, bounded cards with `api_omitted`, incremental + deletions, `--full`, workspace mode, sturn WAL module marking, stale file-card sweeping), status (per-card and `tree_digest` drift), map/card hit-and-miss, find (exact/fuzzy/miss), dependents, refs (text/docs/LSP tiers with error fall-through), doctor, config-flag root changes, and BrokenPipe survival. Includes a regression test for the `neuralmind-shared` monorepo field report (false-empty dependents, file-dump index.yaml, private symbols in cards) and an `ACP_STUB` for agent-mode tests.'
