module: kuda
purpose: '`crates/kuda-cli/tests/e2e.rs` is the CLI smoke/integration suite that drives the real `kuda` binary against temporary fixture repos to exercise the full argv→dispatch path. It verifies `init` scaffolding, `sync` incremental/housekeeping behavior (stale card sweeping, monorepo edge resolution, bounded L0/L1 cards), broken-pipe tolerance of `map | head`, `status` tree-drift detection, and hit-and-miss behavior for `map`, `card`, `find`, `dependents`, `refs`, plus workspace mode and config/error paths.'
