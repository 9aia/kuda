module: kuda
purpose: 'Dagger Python module providing shared, portable CI primitives for Rust workspaces: builds a toolchain container (stable rust, nextest, llvm-cov, sccache), mounts the consumer repo plus optional sibling checkouts under `/work`, and wires cargo/sccache caches, optional GitHub-token auth (in-exec, never in image layers), and dev-link/self-patch rewrites of Cargo.toml so git deps resolve to mounted checkouts. Exposes composable functions (`workspace`, `with_sibling`, `run_script`) and pipeline entrypoints (`doctor`, sharded `test`/`test_shard`, `doctests`, coverage report/gate, `run`) so the same pipeline runs locally or on any orchestrator.'
