path: crates/kuda-cli/src/lib.rs
module: kuda
purpose: Implements the kuda CLI as a reusable library, defining clap parsing and dispatch for init, sync, status, map, card, find, dependents, refs, watch, MCP, ACP, doctor, and hidden CLI-doc generation. Provides the indexing pipeline’s shared configuration, language/domain loading, workspace-root discovery, repository walking, extractor/summarizer selection, and Git-compatible blob hashing. Exposes parse, parse_from, dispatch, and run so the compat binary and external drivers can invoke the same operations.
