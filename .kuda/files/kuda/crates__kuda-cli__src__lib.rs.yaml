purpose: '`crates/kuda-cli/src/lib.rs` is the library composition root for the kuda CLI ("a hippocampus for your codebase — repo memory: index, query, verify"), defining the clap `Cli`/`Cmd` verb tree and the shared `run`/`run_from`/`dispatch` entry points drivers use. It wires embedded language/domain TOMLs, config loading, git content hashing for provenance, `.kuda` scaffolding via `init`, and the incremental extract→summarize→store `sync` pipeline across workspace roots, exposing subcommands for map/card/find/refs, MCP and ACP surfaces, and doctor health checks.'
