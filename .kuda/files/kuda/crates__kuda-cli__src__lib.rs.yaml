purpose: kuda-cli/src/lib.rs is the library composition root for the kuda CLI, defining the clap Cli/Cmd verb surface and the parse/dispatch/run entry points that route argv to ops. It wires config loading, built-in language/domain TOML definitions, domain resolution, git-blob-style content hashing, and the sync pipeline (extract → summarize → store) so drivers and the binary share one op table.
