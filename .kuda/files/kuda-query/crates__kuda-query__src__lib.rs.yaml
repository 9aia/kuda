purpose: 'Thin agent-facing query engine over the `IndexStore` port: `find` (exact symbol lookup), `search` (substring/fuzzy tier), `dependents` (impact analysis with dash/underscore variant expansion, dedup, and defense-in-depth self-edge filtering via `module_key`), `edge_count` (zero means "no dep data", not "no dependents"), `module_symbols`, and `modules`. Filtering/formatting lives here while storage stays behind the port; unit tests drive an in-memory `MockStore` through every query function including legacy self-edge and duplicate-spelling cases.'
