module: kuda-query
purpose: 'kuda-query is the thin agent-facing query layer over `IndexStore`: `find`/`search` do exact/substring symbol lookup, `dependents` expands dash/underscore module spellings via `module_variants`, drops self-edges (`module_key(from) == module_key(to)`), and dedupes by `(from, to, kind)`, while `edge_count`, `module_symbols` (filters found symbols to the queried module), and `modules` delegate to the store.'
