module: kuda-vcs
purpose: 'VCS port for kuda: the `Vcs` trait (`Send + Sync`) covering the operations the watcher and release flow need over clones and detached worktrees — `sync` (fetch+prune), `head_sha` (provenance anchor), `has_commit`, worktree add/remove/prune, and tag exists/create/push. All methods return bool success (or `Option<String>` for the sha) so callers decide whether a failure is retryable (fetch-miss) or fatal; the git adapter lives in `kuda-git`, with jj/hg as future adapter crates.'
