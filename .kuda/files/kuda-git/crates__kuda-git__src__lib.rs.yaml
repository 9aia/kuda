purpose: 'Git adapter implementing the `kuda_vcs::Vcs` port by shelling out to the `git` binary (with `-C <repo>` for every call). Provides the operations kuda needs for provenance and release flows: `head_sha`, `sync` (fetch --prune), `has_commit` (cat-file -e), worktree add/remove/prune, and tag exists/create/push.'
