module: kuda-git
purpose: 'Git adapter of the `Vcs` port: a zero-state `GitVcs` struct that shells out to the `git` binary (`git -C <repo> …`) for `head_sha` (rev-parse HEAD), `sync` (fetch origin --prune), `has_commit` (cat-file -e), detached worktree add/force-remove/prune, and tag exists/create/push-to-origin. All operations return bool success (or `Option<String>` for the sha); the child''s stdout/stderr are inherited, not captured, except for `head_sha`.'
