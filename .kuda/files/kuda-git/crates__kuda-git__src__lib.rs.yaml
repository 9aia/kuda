path: crates/kuda-git/src/lib.rs
module: kuda-git
purpose: Implements the `Vcs` port for Git by shelling out to the `git` binary via a `GitVcs` struct. It provides methods for retrieving the HEAD SHA, syncing with origin, checking commit existence, managing detached worktrees (add/remove/prune), and creating, checking, and pushing tags. All operations return simple success booleans or optional strings, with failures mapped to `false` or `None`.
