path: crates/kuda-acp/src/lib.rs
module: kuda-acp
purpose: Summarizer adapter that spawns an ACP agent (zed, cline, gemini-cli…) over newline-delimited JSON-RPC on stdio to write grounded module-card prose — no API keys, auth lives in the user's agent. Maintains one lazily-initialized agent session reused across modules, answers `session/request_permission` (grants first option) and unknown agent→client requests to avoid deadlocks, and collects only `agent_message_chunk` text so reasoning (`agent_thought_chunk`) never reaches the card. Parses the reply's final `purpose:`/`notes:` block (falling back to the last paragraph) into a `ModuleCard`; unit tests drive a python ndjson stub through ok/error/permission/garbage/close/thought-chunk modes.
