purpose: 'I’ll verify the adapter’s remaining tests and response-handling behavior before returning the concise purpose statement.purpose: Implements an ACP summarizer adapter that spawns an external agent over stdio JSON-RPC, lazily initializes and reuses a session, and turns grounded extraction prompts into module-card prose. Handles streamed replies, permission requests, malformed lines, and protocol errors while excluding thought chunks and reasoning preambles from card fields. Includes stub-based tests for response parsing, session behavior, permissions, and failure paths.'
