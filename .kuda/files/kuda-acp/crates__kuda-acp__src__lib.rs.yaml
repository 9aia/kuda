module: kuda-acp
purpose: 'An ACP (Agent Client Protocol) summarizer adapter in the `kuda-acp` crate that spawns any client-capable agent binary (e.g. `cline --acp`, `zed agent`, `gemini --experimental-acp`) to write grounded module-card prose for the repo memory index — no API keys or provider lock-in, since auth lives in the user''s agent. The private `AcpClient` handles JSON-RPC over the agent''s stdin/stdout (auto-answering `session/request_permission`, collecting streamed `session/update` text chunks), while `AcpSummarizer` lazily maintains one shared session across all modules via a `Mutex`. It implements the `kuda_summarize::Summarizer` trait (`kind` = `"acp"`): `summarize` prompts with up to 30 symbols and 15 source files, then parses the returned prose into a `ModuleCard` by extracting `purpose:`/`invariants:`/`notes:` sections, falling back to the first non-empty line if unmarked.'
