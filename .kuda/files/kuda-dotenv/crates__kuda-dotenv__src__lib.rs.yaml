purpose: '`kuda-dotenv` implements `kuda_secret::Secrets` as `DotenvSecrets`, a `KEY=VAL` file adapter that is the last store in the secrets chain for headless boxes without a desktop keyring; `get` reads the file and returns the first non-empty value for an exact trimmed key match, while `set` upserts a key (creating parent dirs and writing mode 0600 on unix) so tokens persist with restricted permissions.'
