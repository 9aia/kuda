module: kuda-dotenv
purpose: 'Dotenv adapter of the `Secrets` port: `DotenvSecrets { path }` reads/writes a plain `KEY=VAL` file, serving as the last store in the secrets chain for headless boxes without a desktop keyring. `get` returns the first matching non-empty trimmed value; `set` replaces an existing key in place or appends, creates parent dirs, rewrites the whole file, and enforces mode 0600 on unix.'
