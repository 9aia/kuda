purpose: 'Integration tests for `TomlSource::load` covering the full resolution behavior: loading via `$KUDA_CONFIG`, explicit path, missing-file error, malformed-TOML parse errors that surface the path, `./kuda.toml` cwd fallback, unreadable-file read errors (unix-only, mode 0o000), and the no-`HOME`/no-env "no kuda.toml found" error. Env/cwd-mutating tests are serialized through a shared `LOCK` mutex and restore `KUDA_CONFIG`/`HOME`/cwd afterwards.'
