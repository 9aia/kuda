module: kuda-config-toml
purpose: 'TOML adapter implementing the `ConfigSource` port: `TomlSource { path: Option<String> }` resolves the config by search order — explicit `--config` path, else `$KUDA_CONFIG`, else `./kuda.toml`, else `~/.config/kuda/kuda.toml` — and deserializes the first existing candidate into `kuda_core::Config`. Read/parse errors are prefixed with the offending path; when nothing exists it returns `Err("no kuda.toml found …")` (callers decide whether to fall back to defaults).'
