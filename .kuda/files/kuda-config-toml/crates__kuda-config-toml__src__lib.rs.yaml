purpose: '`kuda-config-toml` implements the `ConfigSource` port as `TomlSource`: `load()` resolves config candidates in order — explicit `--config` path, `$KUDA_CONFIG` env var, then `./kuda.toml` and `~/.config/kuda/kuda.toml` — reads the first existing file, and parses it into `kuda_core::Config` via `toml::from_str`, returning a readable error if none is found.'
