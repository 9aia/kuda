module: kuda-secret
purpose: kuda-secret defines the `Secrets` port — a `Send + Sync` trait with `get(&self, name) -> Option<String>` (missing is not an error; callers try the next store in the chain) and `set(&self, name, value) -> std::io::Result<()>` (deploy-time migration; stores that can't write return an error). Implementations live in adapter crates (`kuda-keyring` for OS keyring via `secret-tool`, `kuda-dotenv` for KEY=VAL files), not in this crate.
