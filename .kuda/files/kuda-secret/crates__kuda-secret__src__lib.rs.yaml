purpose: 'Secret port for kuda: the `Secrets` trait (`Send + Sync`) for named-secret resolution from a backing store — `get` returns `Option<String>` where `None` means "not here, try the next store in the chain" (missing is not an error), and `set` persists a value for deploy-time migration, returning `io::Result` since some stores can''t write. Implementations are `kuda-keyring` (OS keyring) and `kuda-dotenv` (KEY=VAL file).'
