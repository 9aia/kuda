path: crates/kuda-store-sqlite/src/lib.rs
module: kuda-store-sqlite
purpose: Sqlite adapter of `IndexStore` — a single-file, zero-server, rebuildable store at `.kuda/index.sqlite` (gitignored) with tables for symbols, edges, meta, and per-file hashes. `replace_module`/`record_files` run delete+insert in one transaction per module; `search` escapes LIKE metachars (`\`, `%`, `_`) so user patterns stay literal; kind enums persist as strings with tolerant fallbacks (unknown symbol kind → `Other`, unknown edge kind → `PackageDep`). A `Mutex<Connection>` satisfies the port's `Send + Sync` bound (rusqlite connections are `!Sync`, single-writer anyway); tests cover kind round-trips, corrupt-kind fallbacks, open/query error paths, and LIKE escaping.
