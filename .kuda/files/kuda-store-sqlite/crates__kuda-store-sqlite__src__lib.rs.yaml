module: kuda-store-sqlite
purpose: 'I''ll read the file to verify the content before summarizing.purpose: `kuda-store-sqlite` is the sqlite adapter of the `IndexStore` port — a single-file, zero-server, rebuildable L2 index living at `.kuda/index.sqlite` (gitignored). It wraps a `rusqlite::Connection` in a `Mutex` (since `Connection` is `!Sync`) to satisfy the port''s `Send + Sync` bound, and implements the full store surface over four tables (`symbols`, `edges`, `meta`, `files`): transactional `replace_module`/`record_files`, exact `find`, LIKE-based `search` (with metachar escaping), `dependents`, `edge_count`, `modules`, `file_hashes`, and `set_meta`/`meta`. `SymbolKind`/`EdgeKind` are persisted as strings with fallback arms (unknown → `Other`/`PackageDep`), and tests cover kind roundtrips, open/query error paths, and LIKE-metachar escaping.'
