purpose: '`kuda-store-sqlite` is the SQLite adapter of kuda''s `IndexStore` port — a single rebuildable file (`.kuda/index.sqlite`, gitignored) storing symbols, edges, meta keys, and per-file content hashes with zero server. `SqliteStore::open` creates parent dirs, opens the connection, and applies the `SCHEMA` (tables `symbols`, `edges`, `meta`, `files` with name/module/to_mod indexes).'
