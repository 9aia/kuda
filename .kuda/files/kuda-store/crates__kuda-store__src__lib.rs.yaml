module: kuda-store
purpose: 'Store port for kuda''s L2 index persistence: the `IndexStore` trait (`Send + Sync`) covering module-keyed incremental writes (`replace_module` for symbols + outgoing edges, `record_files` for per-file content hashes), query reads (`find` exact, `search` substring, `dependents` reverse-edge lookup, `modules`, `edge_count` to distinguish "no dependents" from "no edge data"), and provenance metadata (`set_meta`/`meta`, `file_hashes` as the incremental-extraction diff surface). The store is rebuildable — never the source of truth; the implementation is `kuda-store-sqlite`, with redb/remote/embedding stores as future adapter crates.'
