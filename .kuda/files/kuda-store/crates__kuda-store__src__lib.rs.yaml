module: kuda-store
purpose: '`kuda-store` defines the store port for kuda''s L2 index persistence — the `IndexStore` trait covering symbol/edge writes and query reads (`find`, `search`, `dependents`, `modules`), provenance metadata (`set_meta`/`meta`), and per-file content hashes (`file_hashes`/`record_files`) for the incremental-extraction diff. The only implementation is `kuda-store-sqlite`; redb/remote/embedding backends would be new adapter crates.'
