path: crates/kuda-lsp/src/lib.rs
module: kuda-lsp
purpose: Implements an LSP-backed extractor that spawns a configured language server, communicates over Content-Length-framed JSON-RPC, and collects document symbols in both flat and hierarchical forms. Also provides semantic cross-file reference lookup through `workspace/symbol` and `textDocument/references`, returning sorted, deduplicated file and line pairs. Missing servers or extraction failures degrade to empty or partial results so other extractor tiers can continue.
