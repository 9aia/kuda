path: crates/kuda-lsp/src/lib.rs
module: kuda-lsp
purpose: LSP extractor adapter — spawns one language server per root (command from `extract.lsp_server`) and speaks Content-Length-framed JSON-RPC to pull real symbols via `textDocument/documentSymbol` (both hierarchical `DocumentSymbol` and flat `SymbolInformation` forms), mapping LSP kind ints to kuda `SymbolKind`s and grouping by nearest manifest dir. Degrades gracefully — no configured command, spawn failure, or per-file errors yield empty/partial extraction so other extractor tiers still run; also exposes a `references()` helper (`workspace/symbol` + `textDocument/references`) for semantic cross-file usage above text search. Unit tests drive a python fake LSP server through ok/die/badlen/null/error response modes with env mutation serialized by `ENV_LOCK`.
