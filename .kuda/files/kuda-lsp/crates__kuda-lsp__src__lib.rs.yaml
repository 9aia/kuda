purpose: 'LSP adapter implementing the `kuda_extract::Extractor` port for server-backed extraction via `textDocument/documentSymbol` — the quality tier above treesitter, yielding "real symbols where a language server exists." Spawns one server per root (command from `extract.lsp_server`), and degrades gracefully: a missing/unspawnable server or no configured command returns an empty extraction so the other extractors still run.'
