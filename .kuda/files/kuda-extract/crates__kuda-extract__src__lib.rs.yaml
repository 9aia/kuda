module: kuda-extract
purpose: '`kuda-extract` defines the extraction port of kuda — the `Extractor` trait and `Extraction` result type for pulling symbols, dependency edges, and read-file lists out of source trees. Implementations live in adapter crates: `kuda-manifest` (manifest-based package graph, no parser), `kuda-treesitter` (grammar+query data), and `kuda-lsp` (server-backed); a new extractor is a new adapter crate, and a new language is just a data file.'
