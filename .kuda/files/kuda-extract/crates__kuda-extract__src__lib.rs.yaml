path: crates/kuda-extract/src/lib.rs
module: kuda-extract
purpose: crates/kuda-extract/src/lib.rs defines the extraction port of kuda — the `Extraction` struct (symbols, edges, files, warnings), `ExtractWarning`, and the `Extractor` trait (`kind`, `extract`, `extract_filtered`) that adapters like kuda-extract-manifest, kuda-extract-treesitter, kuda-extract-lsp, and kuda-records implement. Extraction is mechanical only — it reports what grammar/manifest data actually says, never inferred structure — and per-file filtering defaults to delegating to full extraction for adapters without per-file control.
