path: crates/kuda-extract-manifest/src/lib.rs
module: kuda-extract-manifest
purpose: 'kuda-extract-manifest is the manifest adapter for kuda''s extraction port: ManifestExtractor walks a tree, matches manifest basenames declared by LangDef (Cargo.toml, package.json, pyproject.toml, setup.py, go.mod), parses each into a module symbol plus PackageDep edges, and skips excluded dirs and .git-as-file worktrees. parse_manifest dispatches by filename, handling PEP 508/621/735 Python deps, cargo package renames and git-dep basename resolution (when resolve_git_deps is on), and go.mod module/dep lines.'
