module: kuda-config
purpose: kuda-config is the config port plus file implementation that loads `kuda.{yaml,yml,toml}` in order — explicit `--config`, `$KUDA_CONFIG`, `./kuda.*` (YAML preferred), then `~/.config/kuda/` — via scarab-config-file's `for_app("kuda")`, exposing the `ConfigSource` trait, `FileSource` struct with `candidates()`, and `parse_file()` for single-path reads, with tests for explicit/YAML/env/dotfile/parse-error cases serialized by `ENV_LOCK`.
