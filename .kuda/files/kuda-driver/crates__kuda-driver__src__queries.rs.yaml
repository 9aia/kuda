path: crates/kuda-driver/src/queries.rs
module: kuda-driver
purpose: 'Implements pavo’s named kuda queries over SQLite indexes and committed cards, returning JSON payloads for repository summaries, modules, symbols, dependencies, graphs, search, and drift/status. Failures are represented as `{"error": …}` data for partial view degradation, while list results are capped at 200 rows and symbol graphs at 800 symbols.'
