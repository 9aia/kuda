path: crates/kuda-driver/src/queries.rs
module: kuda-driver
purpose: '`crates/kuda-driver/src/queries.rs` implements pavo `query` dispatch over kuda''s read surfaces — `IndexStore` (sqlite), committed `.kuda/` cards, and drift recomputation — mapping names like `repo`, `modules`, `module`, `module_symbols`, `graph` (module or symbol level, capped at 800 symbols), `drift`, `find`/`search`, `dependents`, and `status` to `serde_json::Value` payloads. Unknown queries and missing indexes degrade into `{"error": …}` partial-degradation payloads rather than crashing the view, and `module_symbols` prefers the L2 store with a committed-card fallback.'
