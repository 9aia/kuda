path: crates/kuda-driver/src/ops.rs
module: kuda-driver
purpose: ops.rs derives the `cli.<verb>` wire ops manifest from kuda's own clap command tree so every engine verb is discoverable as a typed op, maps wire params to kuda argv flags, and runs each op by re-execing `tamias-driver-kuda run <argv>` in a child whose cwd is the request's repo, returning `{op, argv, code, stdout, stderr}`; `watch`/`mcp`/`acp` are unbounded surfaces never exposed as ops, `init`/`sync` are the only mutators, and hidden plumbing (`gen-cli-docs`) stays reachable through `run` passthrough only.
