path: crates/kuda-driver/src/ops.rs
module: kuda-driver
purpose: This file implements the engine ops for the kuda driver, mapping `cli.<op>` wire queries to kuda engine commands by re-executing `tamias-driver-kuda run <argv>` in a child process with the request's repo as cwd. It defines an ops manifest (sync, status, map, card, find, dependents, refs, doctor) with parameter mapping to kuda argv flags, keeping long-running surfaces (watch, mcp, acp) separate as they never return. The ops run in child processes to avoid contaminating the serve loop's ndjson stream with engine output.
