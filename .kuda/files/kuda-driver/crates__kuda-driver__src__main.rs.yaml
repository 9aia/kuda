module: kuda-driver
purpose: '`tamias-driver-kuda` is a pavo view driver for kuda that answers wire ops (`manifest`, `views`, `view`, `query`) as ndjson JSON-RPC over stdio via `pavo-driver-kit`''s serve loop, plus plain-argv discovery verbs (`manifest`, `capabilities`, `ops`, `run`). `run` re-executes `kuda::dispatch` for engine passthrough (e.g. `sync --full` mutates `.kuda/`), while views and queries stay read-only and never write the sqlite index; feature-gated `cli`/`mcp` surfaces render the same ops manifest as a clap CLI or MCP tools.'
