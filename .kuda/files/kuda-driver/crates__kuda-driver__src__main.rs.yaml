module: kuda-driver
purpose: Implements the `tamias-driver-kuda` pavo driver, exposing kuda manifests, views, and queries through NDJSON JSON-RPC over stdio plus argv discovery commands. Resolves repository context per request, executes read-only view/query bindings, and routes `cli.*` operations through the kuda engine, including mutating commands such as sync. Also supports direct `run` passthrough to `kuda::dispatch` and reports unsupported wire operations as errors.
