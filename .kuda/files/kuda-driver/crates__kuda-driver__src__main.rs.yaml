module: kuda-driver
purpose: tamias-driver-kuda is a pavo view driver that serves kuda's wire ops (manifest, views, view, query) as ndjson JSON-RPC over stdio via pavo-driver-kit, with plain-argv discovery verbs (manifest/capabilities/ops/run), a `cli` shim verb that strips `--dir`/`--name` driver flags and forwards the rest to `kuda::run_from` for full engine parity, and an optional feature-gated `mcp` surface rendering ops as MCP tools; views/queries are read-only while engine ops re-exec `kuda::dispatch` in the request's repo resolved from root/dir/path, $KUDA_DRIVER_ROOT, or cwd walk-up.
