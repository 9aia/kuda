path: crates/kuda-driver/src/surface.rs
module: kuda-driver
purpose: crates/kuda-driver/src/surface.rs implements kuda's embedded Surface for pavo-driver-kit, letting the `cli`/`mcp` argv verbs serve engine ops without a second binary. `op` routes `cli.<verb>` calls through `ops::run_op`, which re-execs `run` in the resolved repo and returns captured output as an OpOutcome, while `surface` runs `kuda <name> <args>` in-process via `kuda::run_from` for unbounded verbs (watch/mcp/acp) that stream until they stop themselves.
