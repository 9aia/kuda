purpose: repo.rs resolves which kuda-indexed repo a request targets (root/dir/path param, $KUDA_DRIVER_ROOT, or walking up from cwd to nearest .kuda/ or kuda.toml), opens a lazy per-request Ctx holding config, L0 repo card, read-only Sqlite store, and git HEAD, and provides module card listing, drift detection via re-hashed git-blob provenance, and filename-safe module card stems — never writing to the store itself.
