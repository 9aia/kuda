path: crates/kuda-driver/src/repo.rs
module: kuda-driver
purpose: Resolves the repository for each driver request and opens a read-only `Ctx` containing its configuration, repository card, module cards, optional SQLite index, and Git HEAD. Provides card loading, filename-safe module names, and Git-blob-hash drift checks matching `kuda status`. Missing or malformed repository components degrade to defaults or empty values so queries can report an unindexed repository without failing context creation.
