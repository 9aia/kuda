path: crates/kuda-driver/src/repo.rs
module: kuda-driver
purpose: crates/kuda-driver/src/repo.rs defines Ctx, the per-request repo context for pavo wire queries, resolving the repo root from wire params (`root`/`dir`/`path`), `$KUDA_DRIVER_ROOT`, or by walking up from cwd to the nearest `.kuda/` or `kuda.toml`. It lazily loads `kuda.toml` config, the L0 `index.yaml` repo card, the read-only `SqliteStore` (never created by the driver; mutations go through the `run` re-exec), and git HEAD, then exposes `module_cards`, `indexed`, `card_drift` (recomputing git-blob hashes to report `fresh`/`drifted`), and filename-safe card stems via `safe`.
