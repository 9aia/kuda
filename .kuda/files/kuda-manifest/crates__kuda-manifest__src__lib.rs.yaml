purpose: 'Manifest adapter implementing the `kuda_extract::Extractor` port (`kind` = `"manifest"`) — walks the tree for manifest basenames declared by `LangDef` entries (Cargo.toml, package.json, go.mod, …) and turns each into a module-graph node: a `SymbolKind::Module` symbol plus `EdgeKind::PackageDep` edges to its declared dependencies. No parser or language knowledge beyond concrete-format adapters keyed by manifest filename.'
