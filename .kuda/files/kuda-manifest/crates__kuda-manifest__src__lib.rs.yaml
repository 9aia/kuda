path: crates/kuda-manifest/src/lib.rs
module: kuda-manifest
purpose: Implements a manifest-based extractor that walks configured manifest filenames and emits module symbols plus package-dependency edges without requiring language parsers. Supports Cargo, npm, Python PEP 621/Poetry/uv, setup.py, and Go module metadata, including dependency renames and optional Cargo Git repository resolution. Uses directory or manifest-name fallbacks for unnamed or malformed manifests and skips excluded directories and mounted Git worktrees.
