path: crates/kuda-manifest/src/lib.rs
module: kuda-manifest
purpose: Manifest extractor adapter (kind `"manifest"`) — walks the repo for manifest basenames declared by `LangDef` entries and emits one `SymbolKind::Module` symbol per manifest (package name, or dir/manifest-name fallback) plus `EdgeKind::PackageDep` edges, with no parser or language knowledge beyond per-format readers. Supports Cargo.toml (package renames win; optional `git =` dep resolution to repo basename for sibling workspaces), package.json, pyproject.toml (PEP 621, Poetry incl. groups, PEP 735 dependency-groups), setup.py (`name=` scan only), and go.mod; skips excluded dirs and `.git`-file worktrees, and still emits a module symbol for unparsable manifests.
