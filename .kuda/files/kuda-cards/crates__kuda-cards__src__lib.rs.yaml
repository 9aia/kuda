module: kuda-cards
purpose: Serialization boundary between the `kuda_core` domain types (`RepoCard`, `ModuleCard`, `FileCard`) and the committed `.kuda/*.yaml` artifacts, providing render/parse pairs for each card level via `serde_yaml`. Covers the L0 `index.yaml` repo card, L1 `modules/<name>.yaml` cards, and L1.5 `files/<module>/<file>.yaml` per-file cards, so machine fields and the human-owned `notes:` region round-trip through these functions.
