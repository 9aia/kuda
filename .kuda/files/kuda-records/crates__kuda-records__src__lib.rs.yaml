module: kuda-records
purpose: '`RecordsExtractor` is the `records`-kind `Extractor` adapter that turns non-code record corpora (task ledgers, ADRs, handoffs) declared by `DomainDef` descriptors into `SymbolKind::Record` symbols plus `EdgeKind::References` dep-edges — frontmatter (`id = "T-001"`) and checklist (`- [ ] T-001`) records share one per-line capture-group-1 scan, with single-record files taking ref edges from the whole text and multi-record ledgers scoping each record''s refs to its own line. Also exposes `check` (compile-only descriptor health for `doctor`) and `validate` (warnings-only re-scan for `status`/`doctor`), parses `+++` toml / `---` yaml frontmatter into JSON for optional `schema_json` validation (invalid records stay indexed but emit `ExtractWarning`s; files without frontmatter skip silently), and walks declared roots past `.git`-file worktree markers while skipping fenced code blocks for record detection (refs inside fences still edge).'
