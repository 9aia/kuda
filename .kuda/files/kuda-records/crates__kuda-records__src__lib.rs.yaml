path: crates/kuda-records/src/lib.rs
module: kuda-records
purpose: RecordsExtractor turns non-code record corpora declared by DomainDef data into Record symbols and References edges by compiling per-domain record/ref regexes, recursively walking each declared root (including .git-file worktrees, honoring extension and directory excludes), and scanning files line-by-line with capture group 1 as the record id while skipping fenced code blocks and deduplicating first matches per id. Reference edges are scoped to the whole text for single-record files but to each record's own line for multi-record files, preferring capture group 1 over the whole match for edge targets; absent corpus roots are silently skipped while invalid regexes return errors.
