purpose: 'Records extractor adapter (kind `"records"`) — turns non-code record corpora into `SymbolKind::Record` symbols and `EdgeKind::References` edges, with all format knowledge in `DomainDef` regex data (per-line capture-group-1 id scan covers both frontmatter `id = "T-001"` and checklist `- [ ] T-001` records). Reference edges are scoped per record: whole-file text for single-record files, own-line only for multi-record checklists so every task doesn''t edge to every mentioned id; declared corpus roots are walked even through `.git`-file worktree markers, absent roots are silent skips, and bad regexes are compile errors naming the domain.'
