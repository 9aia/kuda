module: dagger
purpose: The `dagger` module's main entry point defining the `Kuda` object type — a set of shared, installable CI primitives (`dagger install github.com/9aia/kuda/modules/dagger`) for Rust workspaces that run identically on a laptop, VPS, or any orchestrator. It builds a rust:slim toolchain container (nextest, llvm-cov, sccache) with mounted cargo/target caches, mounts the consumer repo at `/work/<repo>` (with optional sibling checkouts), rewrites Cargo `[patch]` blocks via `dev-link.sh` and an embedded `_SELF_PATCH_PY` self-patch script, and supports private git deps through a mounted token with an exec-time `insteadOf` rewrite. Exposed pipeline functions include `doctor`, `test_shard`, `doctests`, `test` (parallel nextest shards + doctests after a serial `cargo fetch --locked` warm-up), `coverage_report`, `coverage_gate`, and an escape-hatch `run`.
