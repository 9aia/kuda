module: kuda-keyring
purpose: kuda-keyring implements the `KeyringSecrets` adapter for the `kuda_secret::Secrets` trait, shelling out to `secret-tool` (libsecret) with a `service` attribute (default "kuda") to group all kuda entries. `get` runs `secret-tool lookup` and returns the trimmed value on success, while `set` runs `secret-tool store` piping the value to stdin; headless boxes without dbus simply miss every lookup and the caller falls through to the file store.
