module: kuda-keyring
purpose: 'Keyring adapter of the `Secrets` port that shells out to `secret-tool` (libsecret), grouping all entries under a `service` attribute (default `"kuda"`). `get` looks up `service`/`name` attributes and returns trimmed non-empty stdout on success; `set` stores with a `"<service>: <name>"` label, piping the value via stdin so it never appears in argv. Headless boxes without dbus simply miss every lookup (`None`) so the caller falls through to the file store.'
