name: kuda
path: Cargo.toml
purpose: The `kuda` CLI crate — composition root binary that parses `kuda.toml`, wires adapters behind ports, and runs subcommands (init, sync, status, map, card, find, dependents, refs, mcp, acp, doctor, gen-cli-docs), including an incremental hash → extract → summarize → store indexing pipeline and MCP/ACP stdio servers. Also contains e2e smoke tests (`help_and_stub`, `init_scaffolds`) and, oddly, a Python test for the dagger self-patch script.
