notes: |
  - stdout writes survive `| head`: BrokenPipe exits 0 instead of panicking (regression-tested by `map_survives_broken_pipe`).
  - Provenance uses in-process git blob hashes (`"blob <len>\0"` + bytes, sha1) — identical to `git hash-object`, no subprocess per file.
  - `kuda init` refuses to overwrite an existing `kuda.toml` (exit 1).
  - Stale L1 file-card sweeping is housekeeping, not summarization: it runs under default config and must not be gated on `file_cards`/acp summarize settings.
  - The Dagger `_SELF_PATCH_PY` rewrite is idempotent: re-runs are byte-identical, stale patch rows and inner comments are stripped, surrounding tables/comments survive.
  - `sync` falls back to the config dir when `--workspace` is set but `.kuda/workspace.yaml` is missing/empty; workspace roots are resolved relative to that file's dir.
  - Declared domain corpus roots are descended into even when a `.git`-file worktree marker is present (myco's `project/` case); other worktrees are skipped.
  - `watch` is excluded under `cfg(coverage)` (unbounded loop discards coverage data) and exercised by e2e in normal builds.
  - Dagger auth token is mounted as a secret and the insteadOf rewrite runs inside each exec, never in an image layer; `CARGO_NET_GIT_FETCH_WITH_CLI=true` so cargo shells out to git for the credential rewrite.
  - The self-patch block is needed because transitive git deps can reference the repo's own crates — without it cargo sees two sources for the same package; patch URL derives from `patch_host` or the repo's own `repository` field, and errors if neither exists.
  - `test_self_patch.py` extracts the embedded script via AST (so `\n` escapes resolve as at runtime) and also statically checks that no function in `main.py` loads undeclared names (the `patch_host` regression class).
  - e2e monorepo fixture covers dash-named dist imported with underscores (`neuralmind-shared`/`neuralmind_shared`), module-card private-symbol filtering with an `api_omitted` cap, and `tree_digest` drift detection for files added after sync.
