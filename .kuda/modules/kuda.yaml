notes: |
  - `init` refuses to overwrite an existing `kuda.toml` (exits 1 on second run, asserted in `init_scaffolds`).
  - `--help` must list all subcommands: init, sync, status, map, card, find, dependents, refs, mcp, doctor (asserted in `help_and_stub`).

  - `modules/dagger/tests/test_self_patch.py` in the source list is unrelated to the Rust CLI — it tests an embedded bash-heredoc `_SELF_PATCH_PY` script in `dagger/src/kuda/main.py`, so the module symbol list mixes Rust and Python surfaces.
  - `blob_hash` computes git-compatible blob hashes in-process (no subprocess per file), and `sync` reuses it for content-hash freshness; `--full` is accepted but ignored (`_full` param).
