notes: |
  - Sync uses Git-compatible blob hashes and card/store provenance to limit parsing and agent summarization to drift; `sync --full` discards the freshness baseline.
  - Module identity comes from manifest package names, while domain corpus files are grouped by their descriptors; dependency names are normalized and self-edges removed.
  - ACP summarization failures fall back to template cards stamped `kuda-template`, causing ACP regeneration on a later sync.
  - Stale module and file cards are swept independently of current summarizer settings.
  - Dagger self-patching must resolve a repository’s transitive Git dependencies to mounted checkouts, avoiding duplicate package sources and stale `main` code.
  - `kuda init` refuses to overwrite an existing `kuda.toml`; configuration load failures otherwise print a warning and use defaults.
  - Language and domain descriptors are embedded with `include_str!`, so descriptor additions require changes to `LANG_TOMLS` or `DOMAIN_TOMLS` and a rebuild.
  - `status` checks per-card hashes and the L0 `tree_digest`, but older L0 cards without a digest skip the tree-level check.
  - `refs` prefers LSP results when configured and falls back to textual search; its text walk uses hard-noise exclusions rather than `[extract].exclude`.
  - MCP and ACP use line-delimited stdio JSON-RPC; malformed MCP input and notifications are skipped, while unknown ACP methods return method-not-found errors.
  - Dagger excludes `target`, `.git`, coverage, `node_modules`, and local SDK/virtualenv directories from source uploads and mounts Cargo, target, and sccache cache volumes.
  - Dagger GitHub tokens and sccache configuration are mounted secrets; Git credential rewriting runs inside execs rather than image layers.
  - Dagger self-patching derives its patch URL from `patch_host` or Cargo’s `repository` field and errors if neither is available; its heredoc is regression-tested via AST extraction with `pytest modules/dagger/tests/`.
  - The Dagger Python package requires Python 3.14 or newer; parallel tests warm the shared Cargo Git cache serially first to avoid fetch races.
