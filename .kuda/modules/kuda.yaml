name: kuda
path: Cargo.toml
purpose: 'Root Cargo workspace for kuda ("a hippocampus for your codebase — repo memory: index, query, verify"), a 20-crate Rust workspace whose binary crate `kuda-cli` produces the `kuda` CLI at `src/main.rs`.'
api:
- name: kuda
  kind: module
  file: Cargo.toml
  line: 1
  module: kuda
- name: kuda
  kind: module
  file: crates/kuda-cli/Cargo.toml
  line: 1
  module: kuda
deps:
- clap
- clap-markdown
- kuda-acp
- kuda-cards
- kuda-config
- kuda-config-toml
- kuda-core
- kuda-extract
- kuda-git
- kuda-lsp
- kuda-manifest
- kuda-query
- kuda-store
- kuda-store-sqlite
- kuda-summarize
- kuda-template
- kuda-treesitter
- kuda-vcs
- serde_json
- serde_yaml
- toml
notes: |
  - Workspace inherits shared metadata (`version = "0.1.0"`, `edition = "2021"`, `license = "MIT"`, `repository = "https://github.com/9aia/kuda"`) via `version.workspace = true` etc. in member crates.
  - All intra-workspace deps are declared once in `[workspace.dependencies]` with `path = "crates/<name>", version = "0.1.0"` and referenced by members as `<crate>.workspace = true`.
  - The binary package is named `kuda` (directory `crates/kuda-cli`), so the crate dir and published crate name diverge.
  - `resolver = "2"`; the `dist` profile inherits `release` with `lto = "thin"` (used by `dist` builds).
  - `kuda-cli` depends on 16 `kuda-*` workspace crates plus `clap`, `toml`, `serde_json`, `serde_yaml`, and the non-workspace `clap-markdown = "0.1.5"`; `kuda-secret`, `kuda-keyring`, `kuda-dotenv` are workspace members not linked into the CLI.
  - Workspace-level shared deps include `rusqlite` with `bundled` (0.32), `tree-sitter` 0.25, and tree-sitter grammars for rust/typescript/python.
verify:
- Cargo.toml
- crates/kuda-cli/Cargo.toml
