name: kuda
path: Cargo.toml
purpose: The `kuda` CLI composition root and its end-to-end test suite, plus the reusable Dagger CI module for Rust workspaces. `main.rs` parses `kuda.toml`, wires adapters behind ports, and dispatches subcommands (init, sync, status, map, card, find, dependents, refs, watch, mcp, acp, doctor); `e2e.rs` drives the compiled binary against temp-dir fixture repos; the Dagger module builds a cached toolchain container and exposes test/coverage pipeline functions.
