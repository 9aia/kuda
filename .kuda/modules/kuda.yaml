notes: |
  - The binary embeds language (`data/langs/*`) and domain (`data/domains/*`) descriptors at compile time via `include_str!`; adding a descriptor requires rebuilding.
  - Provenance uses in-process git blob hashes (sha1 of `"blob <len>\0"+bytes`), never a subprocess per file.
  - The Dagger module's `_SELF_PATCH_PY` script rewrites the consumer's `[patch]` block to point the repo's own crates at sibling checkouts under `/work`, and must stay idempotent (byte-identical re-runs) and strip stale rows.
  - The Dagger `Source` default path ignores `target`, `.git`, `coverage`, `node_modules`, `dagger/.venv`, `dagger/sdk` so multi-GB build output is never uploaded to the engine.

  - `watch` is excluded under `cfg(coverage)` because its unbounded loop only stops on a signal, which would discard coverage data; it's exercised by e2e in normal builds.
  - The e2e suite includes a regression test for the `neuralmind-shared` monorepo field report: dash-named dist imported as `neuralmind_shared`, where dependents returned false-empty, index.yaml embedded every file, and cards dumped private symbols.
  - Dagger git auth uses an `insteadOf` rewrite that runs inside each exec (reading a mounted secret), never in an image layer, so tokens never persist in layers or cache; `CARGO_NET_GIT_FETCH_WITH_CLI=true` forces cargo to shell out to git so the rewrite applies.
  - The Dagger self-patch URL derives from `patch_host` if given, else the repo's own `repository` field in Cargo.toml (any org, zero config); with neither, it errors.
  - `test_self_patch.py` extracts `_SELF_PATCH_PY` from the module AST (so `\n` escapes resolve as at runtime) and enforces that no public function forwards undeclared names — the `patch_host` regression class.
  - The binary depends on tree-sitter grammar crates (rust, typescript, python, go) directly, plus `notify` for watch, `sha1` for hashing, `text-splitter` for file-card chunking, and `clap-markdown` for the hidden `gen-cli-docs` command.
