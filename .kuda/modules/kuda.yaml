purpose: 'purpose: Root Cargo workspace for kuda, "A hippocampus for your codebase — repo memory: index, query, verify". It also defines the `kuda` CLI package (`crates/kuda-cli`), whose binary is named `kuda` and built from `src/main.rs`.'
