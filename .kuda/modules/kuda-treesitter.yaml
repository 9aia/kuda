purpose: '`kuda-treesitter` is the tree-sitter extraction adapter — it compiles a grammar per `LangDef.grammar` id, runs the language''s `symbol_query` (or `DEFAULT_RUST_QUERY`) and optional `dep_query` over source files, and emits `Symbol`s plus `EdgeKind::Imports` edges. New languages require a data file (`data/langs/*`) plus a `language()` arm; the symbol-kind vocabulary stays fixed.'
