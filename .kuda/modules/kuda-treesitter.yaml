purpose: '`kuda-treesitter` is the tree-sitter extract adapter — runs per-language symbol/dep queries over compiled grammars (rust, typescript, python) to produce `Symbol`s and `Imports` edges, with per-language knowledge held in `data/langs/*` (grammar id, extensions, `symbol_query`/`dep_query`).'
