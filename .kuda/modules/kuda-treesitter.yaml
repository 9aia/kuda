purpose: Tree-sitter extraction adapter implementing the `Extractor` port — compiles per-language grammars and queries (grammar/queries come from `data/langs/*`; this crate only runs queries over grammars it has compiled in) to emit symbols, import edges, and walked file lists. Module identity is the manifest-dir package name (via `manifest_dir_of` + `pkg_names`), not the directory name.
