notes: |
  - Module identity is the PACKAGE name, not the dir name: `manifest_dir_of` finds the nearest ancestor holding a declared manifest, then `pkg_names` maps that dir to the manifest extractor's name (dir-name then `_root` fallbacks).
  - Only `@dep` captures produce import edges — queries may capture auxiliary nodes for `#eq?` predicates; `self`/`crate`/`std`/`core`/`alloc`/`super` roots and relative imports (via `dep_root` → None) never become edges.
  - Symbol kind comes from the capture-name suffix (`@name.<kind>` → `SymbolKind`, unknown → `Other`); lines are 1-based; unknown grammar ids are skipped silently while invalid query source is a hard `Err`.
  - Walk skips `dir_excluded` dirs (built-ins + `[extract] exclude`) and `.git`-file worktrees; unreadable files/dirs are skipped quietly.
  - Adding a language = a `data/langs/*` data file PLUS a `language()` match arm (the compiled-grammar vocabulary is fixed) — a LangDef with no compiled grammar contributes nothing; a missing `symbol_query` falls back to `DEFAULT_RUST_QUERY` regardless of language, and a missing `dep_query` means no import edges for that language.
  - `extract_filtered` still walks the tree but parses only listed repo-relative files — everything else stays as stored in the index.
  - `pkg_names` is `#[doc(hidden)]` — populated by the CLI from manifest extraction, keyed by repo-relative manifest dir (root = `""`).
  - `parser.parse` is treated as infallible for bundled grammars (`unwrap` under `cfg(coverage)`, skip-on-None otherwise).
