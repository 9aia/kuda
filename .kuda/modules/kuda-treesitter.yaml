notes: |
  - `kind()` returns `"treesitter"`; languages without a compiled grammar (`language()` returns `None`) are skipped silently — only `rust`, `typescript`/`tsx`, and `python` have arms.
  - `walk_files` descends only into dirs where `kuda_core::dir_excluded(name, excludes)` is false **and** the dir lacks a `.git` *file* (worktree marker); files match when their extension (compared with the leading `.` trimmed) appears in `lang.extensions`. Non-UTF-8 dir names are excluded (`to_str().map(...).unwrap_or(true)`).
  - Symbol `kind` derives from the capture name suffix after the last `.` (`@name.function` → `Function`, etc.; unknown → `Other`), and `line` is `start_position().row + 1` (1-based).
  - `module_of` returns the nearest ancestor dir (under `root`) containing a declared manifest basename, named by that dir's filename; fallback is `"_root"`.
  - Import edges skip the pseudo-deps `self`, `crate`, `std`, `core`, `alloc`, `super` and captures with empty capture names; a missing `dep_query` means no import edges for that language.

  - `DEFAULT_RUST_QUERY` is used as the symbol query fallback for *any* language that ships no `symbol_query` — a non-Rust language without a query will attempt Rust-node patterns against its own grammar, likely yielding zero or erroneous matches rather than an error.
  - `extract` propagates only query-compile and `set_language` errors (`Err(String)`); unreadable/unparsable files are skipped via `continue`, and each walked file's root-relative path is pushed to `out.files` even if no symbols matched.
  - `language()` maps both `"typescript"` and `"tsx"` ids to the TypeScript grammar (not the TSX grammar), so `.tsx`-specific syntax may parse incorrectly despite `tsx` being an accepted id.
  - The `from` of every emitted `Imports` edge is the *file's module* (via `module_of`), and the `to` is the raw captured text (e.g. `kuda_core::DepEdge`), not a resolved package — dedup/normalization happens downstream.
