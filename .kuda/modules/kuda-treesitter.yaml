purpose: Tree-sitter extractor adapter (kind `"treesitter"`) — runs per-language symbol and import queries from `LangDef` data over compiled grammars (rust, typescript/tsx, python, go) to emit symbols and `EdgeKind::Imports` edges. Module identity matches the manifest extractor's package names via `pkg_names`, and `extract_filtered` supports incremental per-file re-parse.
