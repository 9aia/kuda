notes: |
  - New language support = data file + one `language()` match arm; the symbol vocabulary stays fixed (`kind_of` maps `@name.<kind>` captures to `SymbolKind`).
  - `extract_filtered` parses only the listed repo-relative files (incremental path); `extract` parses everything `walk_files` finds for each language's extensions.
  - Dep edges skip keyword/self refs (`self`, `crate`, `std`, `core`, `alloc`, `super`); absent `dep_query` data means no import edges for that language.
  - `walk_files` skips excluded dirs (via `kuda_core::dir_excluded` + `excludes`) and any directory containing a `.git` entry.

  - Only rust, typescript/tsx, and python have compiled grammars in `language()` — any other `grammar` id silently yields no extraction (`continue`), not an error.
  - `DEFAULT_RUST_QUERY` doubles as the fallback symbol query for *any* language whose `LangDef` ships none, which will fail to compile against non-rust grammars.
  - `pkg_names` is `#[doc(hidden)]` and populated by the CLI (kuda-cli's `sync_one`), not by this crate.
