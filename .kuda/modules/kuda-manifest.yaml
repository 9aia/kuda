notes: |
  - Directory traversal skips excluded dirs (via `kuda_core::dir_excluded` using `[extract] exclude` names) and never descends into mounted git worktrees — `.git` as a *file* marks a worktree, not a repo dir.
  - The module name comes from the manifest's package name, falling back to the parent directory name, then the manifest basename; every manifest read is recorded in `Extraction.files` and gets a symbol at `line: 1`.
  - Dependency keys per format: Cargo → `dependencies` + `dev-dependencies` + `build-dependencies`; package.json → `dependencies` + `devDependencies`; go.mod → tab-indented require lines containing `" v"`. Unparseable manifests yield no name and no deps (never an error).
  - Unknown manifest basenames return `(None, [])` from `parse_manifest`.

  - `parse_manifest`, `cargo`, `package_json`, `go_mod` are private (not `pub`), despite being listed — only `ManifestExtractor` is public.
  - Reads files with `unwrap_or_default()` — unreadable manifests parse as empty text rather than failing.
  - Crates: `kuda-core`, `kuda-extract`, `toml = "0.8"`, `serde`, `serde_json`.
