name: kuda-manifest
path: crates/kuda-manifest/Cargo.toml
purpose: '`kuda-manifest` is a manifest-based extraction adapter — it implements the `Extractor` trait (`kind() == "manifest"`) by walking the tree for manifest basenames declared by `LangDef` entries (Cargo.toml, package.json, go.mod, …) and emitting a package graph: a `SymbolKind::Module` symbol per manifest plus `EdgeKind::PackageDep` edges for declared deps. No parser, no language knowledge — format detection is by filename.'
