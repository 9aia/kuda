purpose: '`kuda-manifest` is the manifest extraction adapter — it walks a repo root for manifest basenames declared by `LangDef.manifests` (Cargo.toml, package.json, go.mod, …) and turns each into a `SymbolKind::Module` symbol plus `EdgeKind::PackageDep` edges. It has no parser or language knowledge beyond filename-dispatched readers (`parse_manifest` → `cargo`/`package_json`/`go_mod`).'
