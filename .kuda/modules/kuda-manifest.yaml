notes: |
  - `kind()` always returns `"manifest"`; `extract` returns `Ok(Extraction)` even on unreadable dirs (skipped silently via `read_dir` error → `continue`).
  - Directories are skipped when `kuda_core::dir_excluded(name, &self.excludes)` matches (built-in `default_excludes` + `[extract] exclude` extras) **or** when the dir contains a `.git` *file* (mounted git worktree marker).
  - Only files whose basename is in the union of `langs[].manifests` are processed; each yields one `Symbol { kind: Module, line: 1 }` whose `name`/`module` is the package name (or parent-dir / basename fallback), one `DepEdge { kind: PackageDep }` per declared dep, and the root-relative path pushed to `out.files`.
  - `parse_manifest` dispatch strictly on basename: `"Cargo.toml"` → `cargo`, `"package.json"` → `package_json`, `"go.mod"` → `go_mod`, anything else → `(None, [])`.

  - Malformed manifests degrade gracefully: `cargo`/`package_json` return `(None, [])` on parse failure, so the fallback module name (parent directory name, else the manifest basename) kicks in — no error propagates.
  - `cargo` collects keys of `dependencies`, `dev-dependencies`, `build-dependencies`; `package_json` collects `dependencies` + `devDependencies` — dev deps are therefore first-class graph edges, not filtered.
  - `go_mod` dep detection is heuristic: lines starting with a tab and containing `" v"` (require-block entries); a single-line `require` block or comments mimicking that pattern may be missed or miscounted.
  - `excludes` is a public field populated by the caller from `[extract] exclude`; it only affects directory descent, not which manifest filenames are accepted.
