purpose: '`kuda-manifest` is the parser-free extract adapter that turns package manifests (Cargo.toml, package.json, go.mod — basenames declared by `LangDef.manifests`) into a module/package graph: one `Module` symbol per manifest plus `PackageDep` edges for declared dependencies.'
