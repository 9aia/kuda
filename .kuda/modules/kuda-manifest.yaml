notes: |
  - `ManifestExtractor` implements `Extractor` with `kind() == "manifest"` and always returns `Ok(Extraction)` (read/parse failures are tolerated via `unwrap_or_default` / fallbacks, never `Err`).
  - Walk skips noise dirs `.git`/`target`/`node_modules`/`.kuda` and any dir containing a `.git` *file* (mounted worktrees); files are matched against the union of all langs' `manifests`.
  - Module name: parsed package name (`package.name` / JSON `name` / `module ` line) else the manifest's parent dir basename, else the manifest filename; a `Symbol { kind: Module, line: 1, module }` is pushed per manifest, and `out.files` records the root-relative path.
  - `parse_manifest` dispatches by exact basename: `Cargo.toml` → `cargo`, `package.json` → `package_json`, `go.mod` → `go_mod`, else `(None, [])`.
  - Dep key sets: Cargo `dependencies`/`dev-dependencies`/`build-dependencies` table keys; npm `dependencies`/`devDependencies`; go.mod lines starting with `\t` and containing ` v` (first whitespace token).
  - Unparseable manifest text yields `(None, deps=[])` — no error surfaces; deps are collected as *keys only* (versions/reqs ignored) and edges are `EdgeKind::PackageDep` regardless of format.
  - go.mod dep heuristic (`starts_with('\t') && contains(" v")`) can match `replace`/`require`-block lines with tab indentation and any token containing " v"; `require (...)` single-line form (no leading tab) is missed.
  - No language knowledge in the walker itself — new manifest formats are `LangDef.manifests` data plus a `parse_manifest` arm; deps (kuda-core, kuda-extract, toml, serde, serde_json) mix workspace and direct specs.
