notes: |
  - Every discovered manifest yields a module symbol even when unparsable or unnamed — package name first, then parent-dir name, then manifest basename as fallback; parse failures never abort the walk.
  - Walk skips `dir_excluded` noise dirs (built-ins + `[extract] exclude` extras) and `.git`-FILE worktree markers; unreadable dirs/manifests are skipped quietly.
  - Cargo dep naming precedence: `package = "real"` rename always wins; only then, with `resolve_git_deps` on and no `workspace` key, a `git =` URL resolves to its repo basename (last segment minus `.git`); everything else keeps the table key.
  - `ManifestExtractor { excludes, resolve_git_deps }` is configured from `[extract] exclude` and `[workspace] resolve_git_deps` — git-dep resolution exists so edges land on sibling repo modules in multi-repo workspaces.
  - pyproject support spans PEP 621 `dependencies`/`optional-dependencies`, Poetry `dependencies`/`dev-dependencies` + group tables (skipping the `python` key), and PEP 735 `[dependency-groups]`; PEP 508 strings are reduced to bare names (extras/markers/versions stripped).
  - setup.py yields only the package name via a textual `name=` scan (deps live in code, not data); go.mod deps are recognized as tab-indented lines containing `" v"` — both deliberately shallow heuristics.
  - Format detection is by manifest basename; unknown basenames are ignored entirely.
