notes: |-
  invariants:
  - `ConfigSource: Send + Sync` has one method, `fn load(&self) -> Result<kuda_core::Config, String>`. The doc comment says it loads and validates, and that `Err` carries a readable message.
  - The only dependency is `kuda-core` (workspace). The crate contains the trait only, with no implementations and no I/O.
  notes:
  - Errors are plain `String`, not a typed error. Callers cannot match on error kinds.
  - The `Send + Sync` bound means every adapter must be thread-safe.
  - `kuda-cli` consumes this port: it imports `kuda_config::ConfigSource` and calls `TomlSource { path }.load()`. `load_config` there turns any error into `Config::default()`, so a failed load can go unnoticed. Only `doctor` prints the error.
  - `lib.rs` has no tests.
