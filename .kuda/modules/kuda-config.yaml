notes: |
  - `load()` returns `Result<kuda_core::Config, String>`: implementations load AND validate, and `Err` must carry a human-readable message.
  - Implementors must be `Send + Sync` (the trait has those supertraits).
  - The file-backed implementation is the separate `kuda-config-toml` adapter; env or remote sources are intended as new adapters behind this same trait, not changes to it.
