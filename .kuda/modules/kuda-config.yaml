name: kuda-config
path: crates/kuda-config/Cargo.toml
purpose: kuda-config is the config port plus file implementation that discovers and loads `kuda.{yaml,yml,toml}` in order — explicit `--config`, `$KUDA_CONFIG`, `./kuda.*` (YAML preferred), then `~/.config/kuda/` — via scarab-config-file's `for_app("kuda")`, exposing the `ConfigSource` trait, `FileSource` with `candidates()`, and `parse_file()` for single-path reads.
