notes: |
  - Degradation is silent, never fatal: no configured server, spawn failure, per-file request errors, or non-array results yield empty/partial `Extraction` so other extractor tiers still run; `references` returns `Ok(vec![])` on null/error `workspace/symbol` results.
  - Reported lines are 1-based (LSP's 0-based + 1); hierarchical `DocumentSymbol` children flatten to `container::name` paths, and flat `SymbolInformation` (with `location`) is handled too.
  - Servers are shut down politely (`shutdown` request + `exit` notification + wait) after each pass.
  - Modules are assigned by walking ancestor dirs for any known manifest basename (`_root` fallback); the internal walk only skips `.git`/`target`/`node_modules`/`.kuda` and `.git`-file worktrees — NOT the full configurable exclude set the CLI walk applies.
  - `request` ignores interleaved messages (notifications, unrelated ids) until its own id replies; a malformed `Content-Length` header is a hard error; one server process handles all languages/files via didOpen/didClose with full file text.
  - `references` includes declarations, dedups and sorts `(file, line)` pairs, and strips only the `file://` URI prefix (no percent-decoding).
  - Unit tests run a python fake LSP server (`KUDA_LSP_MODE`: ok/die/badlen/nullsyms/errsyms/objsyms/errsym/objres) with `ENV_LOCK` serializing env mutation; spawn-handle `unwrap` vs `ok_or` differs under `cfg(coverage)` since piped stdio guarantees the handles.
