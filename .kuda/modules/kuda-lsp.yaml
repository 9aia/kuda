notes: |
  - `LspExtractor { server_cmd: Option<String> }` implements `Extractor` with `kind() == "lsp"`; `extract` returns an empty `Extraction` (never an error) when `server_cmd` is `None` or the server fails to spawn — other extractor tiers still run.
  - `LspClient` speaks LSP framing: `send` writes `Content-Length: <len>\r\n\r\n<body>`, `recv` reads header lines until blank then `read_exact`s the body; `request` increments `next_id` and loops until the matching response id, surfacing `error` as `"<method>: <err>"`; `shutdown` = `shutdown` request → `exit` notify → `child.wait()`.
  - Spawn performs `initialize` (with `rootUri`/`workspaceFolders` from `file://<root>`) then notifies `initialized`; stderr is nulled.
  - Per file: `didOpen` → `documentSymbol` → `didClose`; both SymbolInformation (flat, has `location`) and DocumentSymbol (hierarchical, flattened with `Container::child` names) forms are handled; lines are 1-based (`+1`).
  - `module_of` walks up from the file to the first ancestor containing one of `lang.manifests`, using the dir basename, else `"_root"`; `walk_files` recurses (skipping `.git`/`target`/`node_modules`/`.kuda` and any dir containing a `.git` file) matching extensions with leading dots stripped.
  - `references()` returns sorted, deduped `(file, line)` pairs (line 1-based), returning `Ok(vec![])` on `workspace/symbol` Null/error.
  - `lsp_kind` mapping: 5/23/8/9/10 → Type, 11 → Trait, 12/6 → Function, 13/14 → Const, 2/3 → Module, everything else → Other.
  - Extraction `out.files` only includes files whose `documentSymbol` call *succeeded* (`let Ok(syms) = res else { continue }` skips the push), but symbols/files use paths relative to `root`; spawn failure is silently swallowed (`Err(_) => return Ok(out)`).
  - `request` ignores non-matching messages (server notifications/requests are dropped without replies — no `workspace/configuration` answering, unlike the ACP client), so chatty servers could stall if the response id never arrives.
  - Deps: `kuda-core`, `kuda-extract`, `serde`, `serde_json` (all workspace = true).
