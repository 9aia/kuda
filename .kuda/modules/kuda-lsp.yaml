name: kuda-lsp
path: crates/kuda-lsp/Cargo.toml
purpose: '`kuda-lsp` is the LSP-backed extract adapter — spawns a language server (from `extract.lsp_server`, one per root) and uses `textDocument/documentSymbol` for real symbol extraction (a quality tier above treesitter), plus a public `references()` for semantic cross-file lookups via `workspace/symbol` + `textDocument/references`.'
