purpose: '`kuda-lsp` is the LSP-backed extraction adapter for kuda — it implements the `Extractor` trait (`kind() == "lsp"`) by spawning a language server (command from `extract.lsp_server`, e.g. `rust-analyzer`) per root and pulling symbols via `textDocument/documentSymbol`, plus a `references` helper for `textDocument/references`. It''s the quality tier above treesitter: real symbols wherever a language server exists.'
