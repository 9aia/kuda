notes: |
  - Missing configuration or a missing server binary are non-fatal: `server_cmd: None` or a failed `spawn` yields an empty `Extraction` so other extractor tiers still run.
  - LSP framing is `Content-Length: N\r\n\r\n<body>`; `request` increments `next_id`, loops `recv` until the matching id (dropping notifications), and surfaces JSON-RPC `error` as `Err`.
  - The client sends `initialize` (with `rootUri` + one workspace folder) then `initialized` on spawn, `didOpen`/`documentSymbol`/`didClose` per file, and `shutdown()` after extraction/references.
  - Symbol lines are 1-based (LSP 0-based line + 1); both flat `SymbolInformation` (with `location`) and nested `DocumentSymbol` responses are handled, the latter via `flatten_syms`; `references` results are sorted and deduped.

  - Server stderr is discarded (`Stdio::null()`), which can hide startup diagnostics; unreadable files are skipped silently.
  - `walk_files` and `module_of` reuse the manifest-based module grouping (per-lang `manifests` + extensions), so `out.files` records every file opened — feeding `Provenance.files`.
  - Dependencies: `kuda-core`, `kuda-extract`, `serde`, `serde_json`; no LSP client library — the protocol is hand-rolled over stdio pipes.
