notes: |
  - Extraction is mechanical only — report what the grammar/manifest actually says, never inferred structure.
  - `Extractor: Send + Sync`; `kind()` returns the string matched against `extract.kinds` in `kuda.toml`, and `extract`/`extract_filtered` return `Result<Extraction, String>`.
  - `extract_filtered` has a default implementation that ignores the file filter and delegates to `extract` — adapters without per-file control are always cheap or server-backed.

  - Extensibility rule: a new extractor = new adapter crate; a new language = data file (no code change).
  - `Extraction` derives `Debug` and `Default`, so a default pass yields empty vectors.
