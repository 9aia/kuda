notes: |
  - Mechanical extraction only: adapters report what the grammar/manifest actually says, never inferred structure.
  - `Extractor` is `Send + Sync`; `kind()` returns the static string matched against `extract.kinds` in `kuda.toml`.
  - `extract_filtered` defaults to delegating to `extract` (ignoring the file filter) — adapters without per-file control are always cheap or server-backed anyway; regression-tested with a `Stub`.
  - Adding an extractor means a new adapter crate (`kuda-manifest` for package graphs without a parser, `kuda-treesitter` for grammar+query data, `kuda-lsp` for server-backed extraction); adding a language is just a data file, not a change here.
  - `Extraction.files` must list the files actually read — it is what makes per-card provenance hashes accurate.
