name: kuda-extract
path: crates/kuda-extract/Cargo.toml
purpose: '`kuda-extract` defines the extraction port of kuda — the `Extractor` trait and the `Extraction` result type (symbols, dep edges, and the files read, which feed `Provenance.files`) for pulling structure out of source trees. Implementations live in adapter crates: `kuda-manifest` (manifests → package graph, no parser), `kuda-treesitter` (grammar+query data), and `kuda-lsp` (server-backed).'
