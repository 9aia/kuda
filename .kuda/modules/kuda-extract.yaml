notes: |
  - Extraction is mechanical only: adapters report what the grammar/manifest actually says, never inferred structure.
  - `Extraction.files` feeds `Provenance.files`, so every extractor must record the files it read.
  - `Extractor.kind()` returns the kind string matched against `extract.kinds` in `kuda.toml` (`manifest`/`treesitter`/`lsp`/`records`).
  - The trait is `Send + Sync`, so adapters must be thread-safe.

  - `extract_filtered` has a default impl that ignores the per-file filter and calls `extract` — adapters without per-file control are always cheap or server-backed, so only override it when per-file extraction is actually supported (otherwise incremental sync re-extracts the whole root).
  - New extractor = new adapter crate; new language/domain = a data file, not a change to this port.
  - `Extraction` derives `Default`, so adapters can build it incrementally and return partial results.
