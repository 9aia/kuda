notes: |
  - Extraction is mechanical: adapters report what grammars or manifests actually contain rather than inferred structure.
  - Extractor implementations must be `Send + Sync` and expose a static `kind` matching `extract.kinds` configuration.
  - Extraction warnings are non-fatal and retain the path of the file that caused them.
  - `extract_filtered` accepts repo-relative paths but defaults to ignoring the filter and calling full `extract`; adapters must override it for actual incremental filtering.
  - Errors are returned as `Result<Extraction, String>`.
  - This crate depends only on `kuda-core`; concrete extraction behavior belongs in separate adapter crates, while new languages and domains are descriptor data.
  - The unit test verifies only the default filtered-to-full delegation behavior.
