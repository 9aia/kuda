notes: |
  - Consumer workspace mounts at `/work/<repo>`; `scripts/dev-link.sh` rewrites the `[patch]` block to sibling checkouts actually mounted under `/work`, and remaining git deps resolve over https floating on `main`.
  - Private git deps require a GitHub token passed as `test(token=...)` (mounted secret); the insteadOf credential rewrite runs inside each exec, never in an image layer, so the token never persists in an image layer or cache.
  - `Source` defaults to `.` and always ignores `target`, `.git`, `coverage`, `node_modules`, `dagger/.venv`, and `dagger/sdk` (target/ alone can be ~8.5 GB).
  - `cargo fetch --locked` warms the shared cargo git db serially before test-shard fan-out to avoid cache-volume races on concurrent first-time fetches.
  - `test()` gathers all shards plus doctests concurrently and raises `RuntimeError` listing every failed stage if any fail.

  - `pyproject.toml` requires Python >=3.14 and depends on `dagger-io` as an editable path dependency to `sdk` (`[tool.uv.sources]`), not PyPI.
  - Coverage functions (`coverage_report`, `coverage_gate`) require the consumer repo to ship `scripts/coverage.sh`; `run()` is the escape hatch for repo-specific gates without module code.
  - The self-patch (`_SELF_PATCH_PY`) uses the repo's `patch_host` if given, else derives the patch URL from `Cargo.toml`'s `repository` field, and fails if neither is available.
  - `coverage_report` returns the `coverage/` directory; export with `dagger call ... coverage-report export --path=coverage`.
