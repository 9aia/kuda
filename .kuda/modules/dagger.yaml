name: dagger
path: modules/dagger/dagger/pyproject.toml
purpose: A Dagger module (`kuda`, installable via `dagger install github.com/9aia/kuda/modules/dagger`) exposing shared CI primitives for Rust workspaces — container setup, dev-link/self-patch of mounted repos, and `@function` pipelines for doctor, sharded nextest + doctests, coverage, and arbitrary scripts, all running with the consumer workspace mounted at `/work/<repo>`.
