name: docs
path: docs/package.json
purpose: 'I’ll inspect the documentation’s navigation, generation scripts, and cross-cutting guidance to produce a grounded module card with only evident invariants and practical gotchas.purpose: User-facing documentation for kuda’s code-map engine, covering installation and indexing, architecture and releases, comparisons, and task guides for languages, record corpora, workspaces, summarizers, and agent integrations. Includes generators for configuration, crate API, and rustdoc-index documentation. invariants: - Cards are committed, provenance-checked artifacts whose `verify:` files must be consulted before acting; the source code remains the source of truth. - The SQLite L2 graph is gitignored, rebuildable derived state, while L0/L1 cards are committed. - Extraction is mechanical and rerunnable; incremental sync hashes inputs and reprocesses only drifted modules or files. - Language-specific extraction knowledge belongs in `data/langs/*.toml`; adding a compiled grammar requires a tree-sitter adapter registry entry. notes: - `docs/reference/config.md` is generated from config-struct doc comments by `gen-config-docs.py`; edit those comments rather than the generated page. - `gen-crate-map.py` regenerates both the architecture crate table and `reference/crate-api.md` from workspace Cargo manifests; run it from `docs/` or account for its relative output paths. - `gen-api-index.py` generates only the styled rustdoc landing page, not `reference/crate-api.md`. - Language descriptors are embedded at build time, so adding one requires rebuilding the CLI. - MCP and ACP are stdio JSON-RPC surfaces over the same `.kuda/` artifacts; MCP exposes tools, while ACP exposes a promptable agent. - ACP summarization falls back silently to deterministic templates per module on agent failure; provider and model settings are environment variables, not ACP CLI flags. - Multi-repo `dependents` merges workspace stores, but `find` and `refs` remain per-root and there is no aggregate workspace card. - The sturn WAL supplements rather than replaces filesystem hash diffing; writes bypassing sturn are still indexed. - The initial `kuda deploy release` publication is explicitly manual; subsequent releases are push-driven, latest-wins jobs.'
