notes: |
  - `reference/config.md`, `reference/crate-api.md`, and the crate-map table inside `explanation/architecture.md` are generated — never hand-edit; edit the source struct doc comments / Cargo.toml descriptions and re-run `docs/gen-config-docs.py` / `docs/gen-crate-map.py`.
  - `docs/gen-api-index.py` writes `public/api/index.html` only; `reference/crate-api.md` is owned by `gen-crate-map.py` (the two generators must not both write it).
  - Documentation claims must stay grounded in the shipped crates — `kuda-llm` is "planned/parked", `resolve_git_deps` records intent but the extractor tier hasn't landed, `find`/`refs` are per-root (only `dependents` merges across `--workspace`).
  - Cards are hypotheses: every doc that shows a card or `module_card` response points the reader at the `verify:` file list and `kuda status` drift check.

  - `gen-config-docs.py` and `gen-crate-map.py` resolve the repo root via `KUDA_ROOT` env or `__file__/../..`; `gen-crate-map.py` writes `explanation/architecture.md` and `reference/crate-api.md` relative to CWD, so run it from `docs/`.
  - `gen-crate-map.py` hardcodes a `LAYER` map for port crates (`kuda-runner`, `kuda-tunnel`, `kuda-trigger`, `kuda-status`, `kuda-vcs`, `kuda-queue`, `kuda-service`, `kuda-secret`, `kuda-config`, `kuda-cache`); new port crates need an entry there or they sort as `impl`.
  - `gen-config-docs.py` only reads `crates/kuda-core/src/lib.rs` — adapter-crate config structs are not yet sourced (the `SRCS` map is the extension point).
  - `how-to/languages.md` and `how-to/domains.md` both end with "ship the descriptor + register it in code": languages register in the `kuda-extract-treesitter::language()` match arm, domains register in `DOMAIN_TOMLS` in `crates/kuda-cli/src/main.rs` — both are build-time embedded, not runtime-discovered.
  - `how-to/llm-summarizer.md` documents the `acp` summarizer's env-var contract (`CLINE_PROVIDER`/`CLINE_MODEL`, not `-P`/`-m`) and the auto-answer of `session/request_permission` — changing either breaks batch card generation.
  - `how-to/multi-repo.md` is explicit that there is no aggregate workspace card yet; readers compose one from `kuda map` per root.
  - `comparison.md` positions kuda against grep/RAG/LSP — keep it in sync when a new adapter (e.g. embeddings store) lands, since it currently lists fuzzy semantic lookup as "(optional store adapter later)".
  - `explanation/release-model.md` documents the two-phase release (manual `kuda deploy release` seed, then push-driven `scripts/release.sh`); the 5-minute sleep is the debounce window paired with `queue = "latest"` + `cancel_running` — don't "fix" it as a hack.
