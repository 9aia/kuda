notes: |
  - Generated files are never hand-edited: `reference/config.md` comes from `gen-config-docs.py` reading doc comments on `crates/kuda-core/src/lib.rs` config structs; `reference/crate-api.md` and the crate-map table inside `explanation/architecture.md` come from `gen-crate-map.py` reading workspace `Cargo.toml`s; `reference/cli.md` comes from `cargo run -p kuda -- gen-cli-docs`; `public/api/index.html` comes from `gen-api-index.py` after `cargo doc`.
  - Diátaxis structure is preserved: `tutorials/` (learn), `how-to/` (tasks), `reference/` (lookup), `explanation/` (why), with `getting-started.md` acting as the signpost across all four.
  - Every how-to stays grounded in the actual CLI/config surface it documents — commands, config keys, and file paths cited in the docs must match what `kuda` ships (e.g. `kuda mcp`/`kuda acp` tool lists, `[extract].kinds`, `[summarize].kind`, `data/langs/*.toml` and `data/domains/*.toml` descriptor fields).

  - `bun run docs:gen` (aliased into `docs:dev` and `docs:build`) runs all three generators in order — `docs:cli` → `docs:config` → `docs:crates`; editing a generated file without rerunning the generator will be overwritten on the next build.
  - `gen-crate-map.py` rewrites the crate-map table *inside* `explanation/architecture.md` via regex substitution — the surrounding prose is hand-written, but the `| crate | layer | purpose |` table is machine-owned; the `LAYER` dict in the script hardcodes which crates are `domain`/`port`/`binary`, everything else defaults to `impl`.
  - `gen-config-docs.py` only reads `crates/kuda-core/src/lib.rs` today (the `SRCS` dict) — adapter-crate config structs are not yet scraped, and the "Constraints" section at the bottom of the generated file is hardcoded in the script, not derived.
  - `docs:api` wipes `docs/public/api/*` before copying `target/doc/` — any hand-placed file in that directory is destroyed; `gen-api-index.py` only links crates whose directory name starts with `kuda`.
  - `docs/how-to/domains.md` documents the `records` extractor and `data/domains/*.toml` descriptors (ADR-0003); it explicitly notes that repo-local `[domains]` config and non-tree sources are deferred — don't document them as shipping.
  - `docs/how-to/multi-repo.md` is honest about current limits: only `dependents` merges across roots today, `find`/`refs` stay per-root, and there is no aggregate workspace card — keep that caveat when editing.
  - `docs/how-to/llm-summarizer.md` documents `template` and `acp` as the two shipping summarizers and explicitly parks `llm`; the ACP section carries operational gotchas (auto-answered `session/request_permission`, dropped `agent_thought_chunk`, silent template fallback on agent failure) that are contract, not flavor.
  - `docs/explanation/release-model.md` documents a self-release flow (`kuda deploy release` seed + push-driven `scripts/release.sh`) with no hosted CI — the 5-minute debounce, `queue = "latest"`, and `cancel_running` are load-bearing rationale, not incidental detail.
