notes: |
  - Staleness is a property of data, never prose: every card carries `Provenance` (files + parallel hashes, commit_sha, RFC3339 generated_at, generator stamp); `status` diffs commit vs HEAD and re-hashes files — drift is computed, not assumed.
  - Humans own `ModuleCard.notes` — regeneration must never clobber it; machine owns `api`/`deps`/`verify`, and `api` is capped with `api_omitted` carrying the dropped count so the card stays honest.
  - `RepoCard` stays an always-load blob (~1k tokens): the walked file list is never embedded — `tree_digest` (sha1 over sorted "path:hash" lines) + `files_total` carry the snapshot instead.
  - A new language or record corpus is a data change, not an engine change (ADR-0001): `LangDef`/`DomainDef` descriptors are loaded from `data/langs/*` / `data/domains/*` at runtime.
  - Dash/underscore spellings must not split a module: `module_key` folds both to one canonical key and `module_variants` expands queries, so dependents lookups can't return false empties.
  - All config sections use `#[serde(deny_unknown_fields)]` — a typo'd key in `kuda.toml` is a parse error, not silently ignored; every section has a serde default (extract kinds `manifest,treesitter,records`, summarize `template`, store `sqlite` at `.kuda/index.sqlite`, cards dir `.kuda`).
  - `FileCard` provenance is single-file (`files`/`hashes` len 1); `ContentHash`'s algorithm is pinned by the extractor, not the domain.
  - `dep_root` returns `None` for relative/`@/` imports (intra-module, no edge), reduces python to the first dotted segment, keeps go paths whole (prefix-matched later), and keeps npm `@scope/pkg` two-segment.
  - `DomainDef.roots` are walked even with a `.git`-file worktree marker — the declaration is the intent; `record_patterns` capture group 1 is the record id and the first matching line pins the symbol location.
  - `SymbolKind::Record`/`EdgeKind::References` exist for non-code domain corpora (kuda-records); serde renames are lowercase for symbol kinds, kebab-case for edge kinds.
  - `default_excludes` covers build/vendored noise (`.git`, `.kuda`, `target`, `node_modules`, `generated`, …) and `[extract] exclude` only ADDS names — keeping files out of walks also keeps them out of hashes and agent prompts (agent cost is per-file fed in).
