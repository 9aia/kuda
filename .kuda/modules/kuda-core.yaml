- serde
notes: |
  - Every memory artifact carries `Provenance` (`files`, parallel `hashes`, `commit_sha`, RFC3339 `generated_at`, generator stamp) so staleness is computed — `status` diffs `commit_sha` vs HEAD and re-hashes `files` — never assumed.
  - `ModuleCard.api`/`deps`/`verify` are machine-owned while `notes` is human-owned (`#[serde(default)]`) and survives regeneration; `FileCard.symbols` also defaults when absent.
  - `ContentHash = String` — the hex digest algorithm is pinned by the extractor, not the domain.
  - `is_valid_sha` rejects path injection: length 7..=64, no `..`, no `/`, only ASCII alphanumeric plus `-`, `_`, `.`.
  - Config sub-structs use `#[serde(deny_unknown_fields)]`, so unknown keys in `kuda.toml` fail to parse.
  - `publish_order` topologically sorts workspace members so path-deps publish first and errors with "dependency cycle in workspace" on cycles.

  - Defaults: extract kinds `default_extract_kinds()`, summarize kind `default_summarize_kind()`, store kind `sqlite` at `.kuda/index.sqlite`, cards dir `.kuda`.
  - `Symbol.line` is 1-based; `SymbolKind` serializes lowercase, `EdgeKind` kebab-case (matters for YAML/JSON round-trips).
  - `WorkspaceCfg.resolve_git_deps` resolves `git = ".../org/repo"` manifest deps to sibling roots — declared here but behavior lives elsewhere.
