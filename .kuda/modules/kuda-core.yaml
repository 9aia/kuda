name: kuda-core
path: crates/kuda-core/Cargo.toml
purpose: '`kuda-core` is the dependency-light domain core of kuda — cards, symbols, edges, provenance, and the `kuda.toml` config model — with "no ports, no integrations" (only serde, serde_json, toml). It defines the memory tiers from ADR-0001: L0 `RepoCard` (always-load), L1 `ModuleCard` (on-demand), L2 `Symbol`/`DepEdge` graph (queried), plus `FileCard` (L1.5), `LangDef`, and the `Config` hierarchy.'
