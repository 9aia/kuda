name: kuda-core
path: crates/kuda-core/Cargo.toml
purpose: '`kuda-core` is the domain core — cards, symbols, edges, provenance, and the `kuda.toml` config model, with no ports and no integrations (its only deps are serde/serde_json/toml). It defines the memory-tier artifacts (`RepoCard` L0 always-load, `ModuleCard`/`FileCard` L1 on-demand, `Symbol`/`DepEdge` L2 graph), the `SymbolKind`/`EdgeKind` vocabularies, the `LangDef`/`DomainDef`/`Source` descriptors that make languages and record corpora data-not-code, and the serde config structs with their defaults.'
