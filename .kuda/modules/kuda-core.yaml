notes: |
  - `ModuleCard::notes` is human-owned — machine owns `api`/`deps`/`verify`, and regeneration never clobbers the notes region.
  - `is_valid_sha` rejects path-injection (length 7–64, no `..` or `/`, only alphanumerics plus `-`/`_`/`.`) before values reach worktree paths — kept from the fork per its comment.

  - Language support is data-driven: a new language is a data change to `data/langs/*`, not an engine change (ADR-0001) — `LangDef` carries extensions, manifest names, and optional tree-sitter grammar/symbol/dep queries.
  - `Config` and all its sub-structs use `#[serde(deny_unknown_fields)]`, so a typo'd key in `kuda.toml` is a hard parse error rather than silently ignored.
  - `default_excludes()` is a built-in walk-time skip list (`.git`, `target`, `node_modules`, etc.); `[extract] exclude` adds repo-specific names on top via `dir_excluded`, keeping generated/vendored/build output out of index, hashes, and agent prompts.
  - Defaults: extract kinds `["manifest", "treesitter"]`, summarize kind `"template"` (`"acp"` is the agent path; `"llm"` is backlog), store kind `"sqlite"` at `.kuda/index.sqlite` (rebuildable, gitignored), cards dir `.kuda`.
  - `SummarizeCfg::file_cards` (L1.5 per-file cards) is opt-in because it's ~10–50x the prompt count of module cards, bounded by per-file hash-skip.
  - `ContentHash` is just a `String` alias — the hash algorithm is pinned by the extractor, not the domain.
  - `FileCard::provenance` has `files`/`hashes` of length 1 (single-file provenance), unlike module/repo cards which span multiple files.
