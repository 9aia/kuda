notes: |
  - Every card carries `Provenance` (files + parallel hashes + commit_sha + generated_at + generator); drift is computed by re-hashing, never assumed — staleness is a property of the data, not prose.
  - All config structs use `#[serde(deny_unknown_fields)]`, so a typo in any `kuda.toml` field name fails the load.
  - `RepoCard` deliberately does not embed the walked-file list; it carries `tree_digest` (sha1 over sorted "path:hash" lines) + `files_total` instead, keeping the always-load card ~1k tokens.
  - `ModuleCard.notes` is human-owned and survives regeneration; machine owns `api`/`deps`/`verify`.
  - `ContentHash` is a type alias (`String`); the hash algorithm is pinned by the extractor, not the domain.

  - Default extract kinds are `["manifest", "treesitter", "records"]` (note: `lsp` is opt-in, not a default); default summarize kind is `template`; default store is sqlite at `.kuda/index.sqlite`; default cards dir is `.kuda`.
  - `module_key` folds `-`→`_` and lowercases; `module_variants`/`dep_root` exist specifically so dash-named dists vs underscore imports (e.g. `neuralmind-shared` vs `neuralmind_shared`) can't produce false-empty dependents — `dep_root` returns `None` for relative/`@/` imports (intra-module, no edge).
  - `SymbolKind` serializes lowercase, `EdgeKind` serializes kebab-case — relevant when reading/writing card YAML.
  - `DomainDef.roots` are walked even when they carry a `.git`-file worktree marker (the declaration is the intent), unlike ordinary dirs which the walk skips.
  - `api_omitted`, `tree_digest`, `files_total` use `skip_serializing_if` when zero/empty, so their absence in YAML means zero, not missing data.
