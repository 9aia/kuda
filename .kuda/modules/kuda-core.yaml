notes: |
  - Every card carries provenance linking repo-relative files to parallel content hashes, commit SHA, generation time, and generator identity.
  - Module `api`, `deps`, and `verify` are machine-owned, while `notes` is human-owned and must survive regeneration.
  - File-card provenance contains exactly one file and one hash.
  - Module matching folds case and dash/underscore differences so distribution and import spellings resolve to the same module.
  - Workspace publication orders internal path dependencies before dependents and rejects dependency cycles.
  - Configuration sections deny unknown fields, so misspelled sections or settings fail deserialization.
  - Defaults enable `manifest`, `treesitter`, and `records` extraction, deterministic `template` summarization, SQLite at `.kuda/index.sqlite`, and cards under `.kuda`; LSP and file cards are opt-in.
  - `dir_excluded` compares path component names against built-in noise directories plus exact configured names, not glob patterns.
  - `dep_root` drops relative and `@/` imports, reduces Python dotted imports to their first segment, preserves Go paths, and retains npm scope/package pairs.
  - `ContentHash` does not prescribe a hashing algorithm; the extractor pins it.
  - Zero/empty compatibility fields such as `api_omitted`, `warnings`, `tree_digest`, and `files_total` deserialize by default and are omitted when empty.
  - `is_valid_sha` validates a path-safe revision-shaped string, not the existence or cryptographic format of a Git commit.
