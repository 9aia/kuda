path: crates/kuda-core/Cargo.toml
purpose: 'The `kuda-core` domain crate — pure data types with no ports or integrations: cards (`RepoCard` L0, `ModuleCard` L1, `FileCard` L1.5), the `Symbol`/`DepEdge` graph (L2), `Provenance` (staleness as computed data, not prose), `LangDef` language descriptors, and the full `kuda.toml` `Config` model with `deny_unknown_fields`. Per its docs (ADR-0001), memory tiers are L0 always-load / L1 on-demand / L2 queried, and every card carries `Provenance` so staleness is "a property of the data, not a promise in prose."'
