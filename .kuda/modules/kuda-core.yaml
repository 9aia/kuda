deps:
- serde
- serde_json
- toml
- serde
notes: |
  - Every card carries `Provenance` whose `hashes` is parallel to `files` — staleness/drift is computed by diffing hashes and `commit_sha` vs HEAD, never assumed from prose.
  - `Symbol.line` is 1-based; `Symbol.module` is the index's primary grouping key; `ModuleCard.notes` is `#[serde(default)]` and human-owned so regeneration never clobbers it.
  - All config structs use `#[serde(deny_unknown_fields)]`, so an unknown key in `kuda.toml` is a hard parse error; sections default via `#[serde(default)]` (`extract.kinds` → `["manifest","treesitter"]`, `summarize.kind` → `"template"`, `store.kind` → `"sqlite"`, `store.path` → `.kuda/index.sqlite`, `cards.dir` → `.kuda`).
  - `dir_excluded` matches built-in `default_excludes()` (`.git`, `.kuda`, `target`, `node_modules`, …) plus `[extract] exclude` config extras, applied to every walk.
  - `is_valid_sha` accepts 7–64 chars of `[A-Za-z0-9._-]` and rejects `..` and `/`; `publish_order` errs on a workspace dependency cycle (unit tests cover both).

  - `ContentHash` is a plain `String` alias — the digest algorithm is pinned by the extractor, not the domain, so nothing here validates hex format.
  - `SymbolKind` serializes lowercase; `EdgeKind` serializes kebab-case (`package-dep`, `workspace-member`) — YAML/JSON round-trips depend on these renames.
  - Exclusion is by directory/file *name* only (e.g. `target`, `build`), so a source directory with one of those names anywhere in the tree is skipped, and excludes don't apply to file *contents* or extensions.
  - `Config`'s `repo.name`/`repo.root` are `Option`s with no defaults — the CLI fills `name` from the directory basename; `WorkspaceCfg::resolve_git_deps` defaults to `false`.
