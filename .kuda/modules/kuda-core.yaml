name: kuda-core
path: crates/kuda-core/Cargo.toml
purpose: '`kuda-core` is the pure domain crate for kuda — serde types for the three memory tiers (L0 `RepoCard`, L1 `ModuleCard`, L2 `Symbol`/`DepEdge`), `Provenance`, `LangDef`, and the `kuda.toml` config model (`Config` and its sections), with no ports or integrations (deps: serde, serde_json, toml only). It also hosts shared helpers `default_excludes`/`dir_excluded`, `is_valid_sha`, and `publish_order`.'
