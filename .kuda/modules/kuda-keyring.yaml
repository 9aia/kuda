notes: |
  - Entries are grouped under a `service` attribute (default `"kuda"` via `Default`) — `get` runs `secret-tool lookup service <service> name <name>`, `set` runs `secret-tool store --label "<service>: <name>" ...` and writes the value to the child's stdin.
  - `get` returns `None` when `secret-tool` can't spawn or exits non-zero, and filters out empty/whitespace-only stdout; `set` maps a non-zero exit to `io::Error::other("secret-tool store failed")`.

  - Headless boxes without dbus simply miss every lookup, and the caller falls through to the file store (dotenv) — this adapter is designed to be skippable in the chain.
  - Requires the `secret-tool` binary on PATH; values are passed raw on stdin with no trailing-newline trimming beyond `get`'s `trim()`.
