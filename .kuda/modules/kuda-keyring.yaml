notes: |
  - `KeyringSecrets { service }` implements `kuda_secret::Secrets` and `Default` (service `"kuda"`), which groups all kuda entries under `service = kuda`.
  - `get(name)` runs `secret-tool lookup service <service> name <name>`, returning `None` on spawn failure/non-success/empty trimmed stdout, else the trimmed stdout.
  - `set(name, value)` spawns `secret-tool store --label "<service>: <name>" service <service> name <name>` with piped stdin, writes `value` bytes, and returns `Err("secret-tool store failed")` (via `std::io::Error::other`) on non-success exit; spawn/write errors propagate as `io::Result`.
  - Only dependency is `kuda-secret` (`.workspace = true`).
  - No tests ship with this crate (all listed symbols come from `src/lib.rs` alone); behavior depends on the external `secret-tool` binary being present — `get` treats any lookup failure as "missing," which is the intended fall-through contract.
  - `set` uses `c.stdin.as_mut().unwrap()` after spawn with `Stdio::piped`, so a pipe is guaranteed post-spawn; the label embeds the raw `name`.
