notes: |
  - Secret values never appear in argv: `set` pipes the value to `secret-tool store`'s stdin; `get` returns only trimmed, non-empty stdout on exit success.
  - Lookups are total — headless boxes without dbus, lookup failures, empty output, or a missing `secret-tool` binary all yield `None` so the caller falls through to the file store; only `set` surfaces `io::Error` (spawn failure or non-zero exit).
  - Entries are keyed by the attribute pair `service=<service> name=<name>` with label `"<service>: <name>"`, so changing `service` partitions the keyring namespace.
  - `secret-tool` must be installed and on PATH — the adapter does no dbus/libsecret linking itself, just subprocess calls.
  - The test is a single function on purpose: it mutates process-global `PATH` and `KUDA_STUB_MODE`, which would race under parallel test threads.
