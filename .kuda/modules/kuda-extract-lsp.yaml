notes: |
  - Missing server = empty extraction, never an error: if `server_cmd` is `None` or the spawn fails, `extract` returns an empty `Extraction` so the other extractor tiers still run (silent skip).
  - Symbol lines are 1-based — LSP's 0-based `range.start.line` is stored `+1`; nested `DocumentSymbol` children are flattened into `Container::name` form, while flat `SymbolInformation` (has a `location` object) is read directly.
  - `module_of` walks ancestors from the file's dir looking for a manifest basename and returns that dir's name, falling back to `_root` when no manifest is found — so module attribution follows manifest dirs, not the filesystem root.
  - `walk_files` skips `.git`/`target`/`node_modules`/`.kuda` dirs and any dir carrying a `.git`-file worktree marker.
  - `references()` filters out non-`file://` URIs (e.g. `untitled:`), skips entries with empty URIs, sorts and dedups the `(file, line)` pairs, and treats `workspace/symbol` null/error as an empty result rather than a failure — only protocol-level failures (bad length, server death) return `Err`.
  - `lsp_kind` maps LSP SymbolKind ints to the domain `SymbolKind` (class/struct/enum→Type, interface→Trait, function/method→Function, variable/constant→Const, module/namespace→Module, else Other).
  - Tests drive a Content-Length-framed fake LSP server (`STUB`, a Python heredoc) whose behavior is selected by `$KUDA_LSP_MODE`/`$KUDA_LSP_ROOT`, serialized by `ENV_LOCK`; `LspClient::spawn` has `#[cfg(coverage)]` variants that `unwrap()` the piped stdin/stdout handles.
