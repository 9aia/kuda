name: kuda-extract-lsp
path: crates/kuda-extract-lsp/Cargo.toml
purpose: kuda-extract-lsp is kuda's language-server extraction adapter — it spawns one server per root via extract.lsp_server (e.g. rust-analyzer), requests textDocument/documentSymbol for real per-language symbols, and degrades to empty extraction when the server is missing so other extractors keep running, sitting above treesitter in the quality tier behind the "lsp" extract kind.
