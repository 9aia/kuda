notes: |
  - `DotenvSecrets { path }` implements `kuda_secret::Secrets` with `get`/`set`.
  - `get(name)` reads the file, splits each line on the first `=`, trims key/value, and returns the value only if the key matches and the value is non-empty (missing file or no match → `None`).
  - `set(name, value)` updates the matching line in place (one `name=` occurrence) or appends, creates the parent directory, writes all lines joined with `\n` + trailing `\n`, then (Unix) `chmod 0o600`.
  - Only dependency is `kuda-secret` (`.workspace = true`).
  - Comments/blank lines in the file are preserved as-is (they just don't match any key); `set` on an unreadable-but-existing file falls back to `unwrap_or_default()` — i.e. read failures silently start from an empty list and can truncate the file.
  - `perms_600` test asserts `mode & 0o777 == 0o600` only under `#[cfg(unix)]`; on non-Unix the permission step is compiled out.
  - `set` uses `split_once('=')`, so a value containing `=` survives (only the first `=` splits), but keys are matched after `trim()`.
