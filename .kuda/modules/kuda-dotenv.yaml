purpose: '`kuda-dotenv` is a secret-store adapter implementing `kuda_secret::Secrets` as `DotenvSecrets`, backed by a plain `KEY=VAL` env file written with 0600 permissions — the last store in the chain, for headless boxes without a desktop keyring. Its only dependency is `kuda-secret`.'
