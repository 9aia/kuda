notes: |
  - `set` updates an existing key in place (no duplicate entries — asserted by `set_get_update` checking `text.matches("A=").count() == 1`) or appends a new `KEY=VAL` line, creates the parent dir if needed, and on Unix chmods the file to `0o600` after every write (asserted by `perms_600`).
  - `get` reads the file fresh each call, splits on the first `=`, trims key/value, and skips empty values — returning `None` for a missing file or missing key.

  - Values are written unquoted and looked up by exact trimmed key match — values containing `=` or newlines aren't round-trip-safe, and matching is line-based (no quoting/escaping support).
  - The 0600 permission is only enforced on `set` under `#[cfg(unix)]`; a pre-existing file's permissions aren't checked on `get`.
  - Tests use per-PID temp paths (`kuda-env-<pid>-<tag>`) and clean up afterwards.
