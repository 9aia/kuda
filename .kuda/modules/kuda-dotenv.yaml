notes: |
  - The secrets file is written with mode 0600 on unix after every `set` (regression-tested via permission bits).
  - `set` updates an existing key IN PLACE — never appends a duplicate `KEY=` line; new keys append, parent dirs are created, file ends with a trailing newline.
  - `get` returns `None` for missing keys, empty values, and lines without `=` (malformed lines are skipped, not errors).
  - Parsing is deliberately minimal: keys/values are trimmed, first matching line wins — no quoting, escaping, comments, or `export ` handling, so values containing `=` survive only after the first separator and multi-line values are unsupported.
  - `set` rewrites the whole file on every call (read-modify-write, not atomic); a missing file is treated as empty.
  - Error paths are exercised: a parentless path or a parent that is a regular file makes `set` return an `io::Error` rather than panicking.
