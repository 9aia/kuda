notes: |
  - Symbol captures are `@name.<kind>` where `<kind>` maps to `SymbolKind` via `kind_of` (function/type/trait/const/module/macro, else Other); lines are 1-based (`start_position().row + 1`).
  - Only `dep` captures carry an import target — auxiliary captures for `#eq?` predicates are ignored; relative imports (`dep_root` returns `None`) and the builtins `self`/`crate`/`std`/`core`/`alloc`/`super` produce no edge. Import edges are `EdgeKind::Imports`.
  - A language with no compiled grammar is silently skipped (`continue`); an invalid symbol/dep query is a hard `Err` (`query {e}`).
  - `language()` maps grammar ids to compiled languages: `rust`, `typescript`/`tsx` (both → LANGUAGE_TYPESCRIPT), `python`, `go`; anything else returns `None`.
  - `DEFAULT_RUST_QUERY` is the fallback symbol query when a `LangDef` ships none — so the default query is Rust-shaped regardless of language.
  - `manifest_dir_of` walks ancestors under root for a declared manifest basename and is `pub` so the CLI can map the returned dir to the manifest extractor's package name — module identity is the pkg name, not the dir name; `pkg_names` is keyed by repo-relative manifest dir (`#[doc(hidden)]`).
  - `extract_filtered` is the incremental path — it parses only the listed repo-relative files and skips everything else; `extract` delegates to `extract_inner` with no filter.
  - `walk_files` skips dirs via `kuda_core::dir_excluded` (built-ins + `[extract] exclude`) and skips `.git`-file worktrees; unreadable files/dirs are skipped, and `parser.parse` has a `#[cfg(coverage)]` `.unwrap()` variant (bundled grammars always parse).
