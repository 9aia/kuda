name: kuda-extract-treesitter
path: crates/kuda-extract-treesitter/Cargo.toml
purpose: '`kuda-extract-treesitter` is the tree-sitter extract adapter — it runs grammar+query data over source files to produce symbols and import edges, with per-language knowledge living in `data/langs/*` (grammar id, extensions, symbol_query, dep_query) so a new language is a data file plus a `language()` arm. It compiles in the rust/typescript/python/go grammars and resolves each file''s module to the package name the manifest extractor found (via `pkg_names`), falling back to the manifest dir name then `_root`.'
