purpose: kuda-store defines the `IndexStore` port — kuda's L2 index persistence layer. It exposes module-keyed `replace_module`, exact/substring symbol lookup (`find`/`search`), reverse dependency lookup (`dependents`), module listing, edge counting for honest empty-output distinction, provenance metadata (`set_meta`/`meta`), and per-file content-hash bookkeeping (`file_hashes`/`record_files`) to support incremental sync diffing.
