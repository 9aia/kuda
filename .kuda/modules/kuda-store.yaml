notes: |
  - `IndexStore: Send + Sync` with seven methods, all `Result<_, String>`: `replace_module(&mut self, module, syms, edges)`, `find(&self, name)`, `search(&self, pattern)`, `dependents(&self, name)`, `modules(&self)`, `set_meta(&mut self, key, value)`, `meta(&self, key) -> Result<Option<String>, String>`.
  - Writes are keyed by module so incremental sync replaces one module's symbols and outgoing edges at a time.
  - Read semantics: `find` = exact-name lookup, `search` = substring (fuzzy tier under `find`), `dependents` = reverse edges pointing at `name` (impact analysis), `modules` = currently indexed module names; `set_meta`/`meta` hold provenance bookkeeping like `"commit_sha"`.
  - Only dependency is `kuda-core` (`.workspace = true`); the store is rebuildable — never the source of truth.
