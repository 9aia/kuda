- kuda_core
notes: |
  - The store is rebuildable — never the source of truth.
  - `replace_module` replaces a module's symbols and its outgoing edges atomically per module, enabling incremental sync to update one module at a time.
  - `record_files` replaces a module's file-hash rows and is called with the module's *full* current file set after `replace_module`; `file_hashes` returns path → (hash, module).
  - All methods return `Result<_, String>`; `meta` returns `Option<String>` for missing keys.

  - `IndexStore` requires `&mut self` for writes (`replace_module`, `set_meta`, `record_files`) but `&self` for reads — the query layer takes `&dyn IndexStore`.
  - Depends only on `kuda-core` (for `Symbol`/`DepEdge`); storage choice (path, engine) is the adapter's concern, not the port's.
