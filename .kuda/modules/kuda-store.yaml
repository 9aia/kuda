notes: |
  - The store is rebuildable, never the source of truth (committed `.kuda` cards are).
  - Writes are keyed by module so incremental sync replaces one module at a time: `replace_module` swaps a module's symbols + its outgoing edges, and `record_files` is called with the module's FULL current file set afterwards.
  - `edge_count` exists so callers can distinguish "no dependents" from "no edge data indexed at all" — honest empty output.
  - Read surface maps directly to CLI commands: `find` = exact-name lookup, `search` = substring fuzzy tier, `dependents` = reverse-edge impact analysis; `file_hashes` (path → (hash, module)) is the incremental-extraction diff surface.
  - `set_meta`/`meta` hold provenance bookkeeping keys like `commit_sha` and `extractor_versions`.
  - The implementation is `kuda-store-sqlite`; redb, remote, or embedding stores would be new adapter crates behind this same trait (`Send + Sync`, errors as `String`).
