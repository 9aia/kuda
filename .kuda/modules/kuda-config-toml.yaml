notes: |
  - Resolution order: `self.path` (explicit `--config`) else `$KUDA_CONFIG`; if either yields a path it becomes the *only* candidate (no fallback to defaults), otherwise the default pair `./kuda.toml` then `$HOME/.config/kuda/kuda.toml` (HOME unset → `./.config/kuda/kuda.toml`) is tried in order.
  - Only existing candidates are read; the first existing one is parsed with `toml::from_str`, and read/parse errors are formatted as `read <path>: <e>` / `parse <path>: <e>`.
  - If no candidate exists, `load` returns `Err("no kuda.toml found (search: $KUDA_CONFIG, ., ~/.config/kuda/)")`.
  - Deps: `kuda-config` (port), `kuda-core`, and direct `toml = "0.8"`; tests exercise `ConfigSource::load` via `TomlSource { path: ... }`.
  - An explicit/env path that doesn't exist is an immediate error (it short-circuits the candidate list) — tested by `explicit_path_and_missing_error` with `/nonexistent/x`.
  - Tests mutate `KUDA_CONFIG` with `unsafe { std::env::set_var/remove_var }` (Rust 2024-style); they assume no parallel interference and clean up the temp file afterward.
