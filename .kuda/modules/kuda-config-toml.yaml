notes: |
  - Resolution order is fixed: explicit `--config` path → `$KUDA_CONFIG` → `./kuda.toml` → `~/.config/kuda/kuda.toml`; an explicit path or env var short-circuits the default search (single candidate).
  - The first EXISTING candidate is loaded — a malformed or unreadable file yields an error prefixed with its path (`parse <path>:` / `read <path>:`), never a silent skip to the next candidate.
  - No config anywhere returns `Err("no kuda.toml found …")`; falling back to defaults is the caller's decision, not the adapter's.
  - `$HOME` unset falls back to `.` when building the `~/.config/kuda/kuda.toml` candidate, so the search still completes rather than panicking.
  - Tests mutate process-global env (`KUDA_CONFIG`, `HOME`) and cwd, so they serialize through a shared `LOCK` mutex (poison-tolerant via `into_inner`) and restore prior values; the unreadable-file test is unix-only (chmod 0o000).
