purpose: '`kuda-config-toml` is the file-based `ConfigSource` adapter — `TomlSource::load` resolves and parses a kuda.toml file into `kuda_core::Config`, searching explicit path → `$KUDA_CONFIG` → `./kuda.toml` → `~/.config/kuda/kuda.toml`.'
