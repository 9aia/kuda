path: crates/kuda-config-toml/Cargo.toml
purpose: '`kuda-config-toml` is the TOML config adapter implementing `kuda_config::ConfigSource` for `TomlSource`, loading `kuda.toml` from an explicit `--config` path, `$KUDA_CONFIG`, `./kuda.toml`, or `~/.config/kuda/kuda.toml`. It parses the found file into `kuda_core::Config` using `toml = "0.8"`.'
