purpose: '`kuda-config-toml` implements `kuda-config`''s `ConfigSource` port as `TomlSource`: `load()` resolves candidates in order — explicit `--config` path, `$KUDA_CONFIG` env var, then `./kuda.toml` and `~/.config/kuda/kuda.toml` (HOME falls back to `"."`) — reads the first existing file and parses it into `kuda_core::Config` via `toml::from_str`, surfacing read/parse errors with the file path and `"no kuda.toml found"` when nothing exists.'
