notes: |
  - Candidate search order: explicit `path` → `$KUDA_CONFIG` env var → `./kuda.toml` → `$HOME/.config/kuda/kuda.toml`; only the first candidate that exists is read.
  - A missing config yields `Err("no kuda.toml found (search: $KUDA_CONFIG, ., ~/.config/kuda/)")`; read and parse errors are surfaced with the offending path prefixed (`read <path>: ...` / `parse <path>: ...`).
  - When an explicit path or `$KUDA_CONFIG` is set, no fallback search happens — that single path either loads or errors (asserted by `explicit_path_and_missing_error`, which expects an error for `/nonexistent/x`).

  - Tests mutate `KUDA_CONFIG` via `unsafe { std::env::set_var }` (Rust 2024 edition requirement) and clean up afterwards; they use per-PID temp file names to avoid collisions.
  - Depends only on `kuda-config`, `kuda-core`, and `toml = "0.8"` — it does not apply defaults itself; callers (e.g. kuda-cli's `load_config`) decide whether an error falls back to `Config::default()`.
