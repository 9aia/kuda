notes: |
  - `init` writes `kuda.toml` from `EXAMPLE_TOML` plus `.kuda/` and `.kuda/modules/`, and refuses to clobber an existing `kuda.toml` (exit code 1) — asserted by `init_scaffolds`.
  - `sync` pipeline order is hash → extract → summarize → store; provenance hashes come from `git hash-object` (`hash_files`), and module purpose falls back manifest `description` → crate `//!` doc → crate README → root README.
  - `safe()` sanitizes module names to `[A-Za-z0-9_.-]` before building card paths (`.kuda/modules/{safe(name)}.yaml`).
  - Every subcommand returns an `i32` exit code that `main` passes to `std::process::exit`; `--help` succeeds and lists the subcommands checked in `help_and_stub`.

  - `load_config` never fails — on config error it prints to stderr and falls back to `Config::default()`; same pattern for `workspace_roots` (returns `vec![]` on missing/invalid YAML, and `sync`/`find`/`dependents`/`refs` then fall back to the current dir).
  - `sync_one`'s `full` flag is accepted but ignored (`_full: bool`), despite the `--full` help text promising a rebuild ignoring freshness.
  - `hash_files` shells out to `git` and silently yields an empty string on failure, so non-git dirs produce empty hashes that `status` can then report as drift/length mismatch.
  - `find` falls back from exact to fuzzy substring search, appending `" (fuzzy)"` to the module field; hits are tagged with `repo_tag(dir)` (directory basename) only when spanning multiple workspace roots.
  - `refs` intentionally ignores the `[extract]` exclude list (uses `dir_excluded(name, &[])` so only hard-noise dirs are skipped) — fixtures/testdata are meant to be grepped; LSP semantic refs are tried only when not `--docs` and `lsp` is in `extract.kinds`.
  - `status` returns exit 2 when `.kuda/modules` doesn't exist; the e2e test explicitly skips running `sync` in `$TMPDIR` because it would walk the whole directory.
