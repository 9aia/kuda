name: kuda-cli
path: crates/kuda-cli/tests/e2e.rs
purpose: '`kuda-cli` is the binary composition root for kuda — a clap-parsed CLI that loads `kuda.toml`, wires config/VCS/extractor/store/summarizer adapters, and runs subcommands (init, sync, status, map, card, find, dependents, refs, doctor, mcp, acp, gen-cli-docs) against a repo root or `.kuda/workspace.yaml` roots. It renders L0/L1 cards to `.kuda/index.yaml` and `.kuda/modules/*.yaml`, and serves the index over MCP stdio and ACP.'
