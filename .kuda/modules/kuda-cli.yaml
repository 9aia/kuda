path: crates/kuda-cli/tests/e2e.rs
purpose: 'The `kuda` CLI composition root: parses `kuda.toml`, wires adapters (extractors, summarizers, sqlite store) behind ports, and runs subcommands (`init`, `sync`, `status`, `map`, `card`, `find`, `dependents`, `refs`, `mcp`, `acp`, `doctor`) for repo indexing and query; also serves the index over MCP stdio and ACP JSON-RPC. Returns per-subcommand exit codes from `main` via `std::process::exit`.'
