notes: |
  - `root(cli)` is the config's parent dir (canonicalized, fallback `.`); all file paths (`.kuda/index.yaml`, `.kuda/modules/*.yaml`, store path) resolve under it.
  - `load_config` never fails: on TOML error it eprints and uses `Config::default()`.
  - `init` refuses to overwrite an existing `kuda.toml` (exit 1) and creates `.kuda/` + `.kuda/modules/`; a second run exits 1 (per `init_scaffolds` test).
  - `sync` with `--workspace` iterates `.kuda/workspace.yaml` `roots:` (relative to the file's dir); empty/missing roots fall back to the single current root.
  - Module cards are keyed by `safe(module)` (non `[A-Za-z0-9._-]` chars → `_`) for `card`/MCP/ACP reads — same sanitization used when writing.
  - Incremental sync: if an existing card's `provenance.hashes` equal the freshly computed hashes *and* `purpose != name`, the card is reused and the summarizer is skipped; a name-echo purpose is never cached (forces re-prompt).
  - Provenance hashes come from `git hash-object` per file (`hash_files`); `status` marks a card drifted when any hash differs or file counts differ.
  - `find` does exact lookup first, then fuzzy substring tier with module marked `(fuzzy)`; hits are tagged with `repo_tag` (root dir name) only when spanning >1 workspace roots.
  - Purpose fallback chain for module cards: manifest `description` (Cargo.toml/package.json) → `src/lib.rs`/`src/main.rs` first `//!` doc line → module README first non-heading line → root README.

  - `sync_one` and `sync` take `_full`/`_cli` — the `--full` flag is currently accepted but ignored (no cache-bust yet).
  - `sync` ORs exit codes across roots (`code |= sync_one(...)`), so any root failure makes the whole run non-zero.
  - `load_config`/`hash_files` swallow errors: `hash_files` yields empty strings when `git` is missing or fails, which can make provenance compare equal spuriously.
  - `status` requires `.kuda/modules` (exit 2 with "run `kuda sync` first") and prints a short HEAD sha; it reads `card.provenance` hashes rather than HEAD-diffing.
  - `refs_in` skips `.git`, `target`, `node_modules`, `.kuda` dirs; `--docs` restricts to md/mdx/rst/txt, otherwise a fixed extension list.
  - `refs` tries semantic LSP references first only when not `--docs` and `lsp` is in `extract.kinds` with `lsp_server` set; otherwise falls back to textual sweep.
  - `map`/`card` exit 1 when the file is missing (`cat_file`); `find` exits 1 with "no symbol … — run `kuda sync`?" when no hits; `dependents` exits 0 even for empty results ("nothing depends on …").
  - `mcp`/`acp` read line-delimited JSON-RPC from stdin; `gen-cli-docs` is a hidden subcommand emitting clap markdown.
