notes: |
  - Content hashes are git-native (`git hash-object`), and every card's provenance records the HEAD SHA, file hashes, and generator string `kuda-template/0.1.0`.
  - `init` never overwrites an existing `kuda.toml` — it exits 1 rather than clobbering.

  - `sync` is the main pipeline: extract (manifest/treesitter/LSP per `cfg.extract.kinds`) → group symbols by module → summarize (ACP agent if `cfg.summarize.kind == "acp"`, else `TemplateSummarizer`, with template fallback on ACP errors) → render cards + store. `sync --full` currently ignores its `full` flag (parameter is `_full`).
  - Incremental behavior reuses committed module cards when input hashes match, but never caches a "name-echo" purpose (agent produced nothing) — it re-prompts next time instead of pinning it.
  - Manifest-only pseudo-modules (e.g. root Cargo.toml, docs/package.json) skip the agent prompt entirely since there's no source to ground on; L1.5 per-file cards (`cfg.summarize.file_cards`) are hash-skipped so only changed files spend an agent prompt.
  - Config resolution order for `--config`: `$KUDA_CONFIG`, `./kuda.toml`, `~/.config/kuda/kuda.toml` (via `TomlSource`); a missing/broken config falls back to `Config::default()` with a warning rather than failing.
  - `workspace` mode reads roots from `.kuda/workspace.yaml` (`roots: [...]`, resolved relative to the file's dir); otherwise sync runs on the single current root.
  - E2E tests (`crates/kuda-cli/tests/e2e.rs`) smoke the compiled binary via `env!("CARGO_BIN_EXE_kuda")`: `--help` must list all subcommands, and `init` must scaffold `kuda.toml` + `.kuda/modules` and refuse a second run with exit code 1.
