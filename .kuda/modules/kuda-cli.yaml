  purpose: Composition-root CLI `kuda` (package `kuda`, `crates/kuda-cli`). It parses `kuda.toml`, wires the extractor, summarizer, store and card adapters, and runs the subcommands `init`, `sync`, `status`, `map`, `card`, `find`, `dependents`, `refs`, `mcp`, `acp`, `doctor` and the hidden `gen-cli-docs`. `tests/e2e.rs` smoke-tests the binary.
  invariants:
  - `Cli` has global flags `--config` and `--workspace`. `root()` is the parent directory of `--config`, canonicalized, or `.` if that fails.
  - `load_config` falls back to `Config::default()` on any load error. `EXAMPLE_TOML` and `LANG_TOMLS` (rust, typescript, python, go) are embedded with `include_str!` from `examples/` and `data/langs/`. `langs()` silently drops any lang TOML that fails to parse.
  - `init` refuses to overwrite an existing `kuda.toml`: it prints a message and returns 1. Otherwise it writes `EXAMPLE_TOML` and creates `.kuda/` and `.kuda/modules/`.
  - `sync` runs `sync_one` for each root, ORing the exit codes. With `--workspace` the roots come from `.kuda/workspace.yaml` (`roots:`, resolved relative to the file's directory). It falls back to the current dir if there are no roots. The `--full` flag is accepted but ignored (`_full`).
  - `sync_one` builds extractors from `cfg.extract.kinds` (`manifest`, `treesitter`, `lsp`) and prints a message for an unknown kind. It groups symbols by module and creates `<cards.dir>/modules`. It opens the sqlite store at `cfg.store.path`, and returns 1 if either step fails.
  - Per module, `sync_one` builds `Provenance` (file hashes from `git hash-object`, `commit_sha`, `generated_at` as unix seconds, and generator `kuda-template/0.1.0`). It then summarizes, writes `modules/<safe(name)>.yaml` via `kuda_cards::render_module_card`, and calls `store.replace_module`. Afterwards it writes `index.yaml` (the `RepoCard` with a detected `commands` list), sets `commit_sha` and `generated_at` in the store meta table, writes `meta.json`, and prints `indexed N module(s) at <sha7>`.
  - ACP summarization is used only when `cfg.summarize.kind == "acp"` and `acp_cmd` is set. If it fails for a module, that module falls back to `TemplateSummarizer` with a message on stderr. Any other `kind` uses the template summarizer.
  - Purpose fallback chain, applied only when `card.purpose == card.name`: manifest `description` (`Cargo.toml` `[package]` or `package.json`), then the first `//!` line in `src/lib.rs`, then in `src/main.rs`, then the module README, then the root README. README lines starting with `#`, `!` or `[` are skipped. The repo-card purpose uses `readme_purpose` of the root `README.md` only.
  - `safe()` maps every character that is not ASCII alphanumeric, `-`, `_` or `.` to `_`. It is used for card file names in `sync_one`, `card`, `mcp` and `acp`.
  - `status` reads `.kuda/modules/*.yaml` and compares each card's provenance hashes with fresh `git hash-object` output. A card is "drifted" if any hash differs or the file counts differ. It prints `N fresh, M drifted (HEAD <sha7>)` and returns 2 when `.kuda/modules` is missing.
  - `map` and `card` print `.kuda/index.yaml` and `.kuda/modules/<safe(module)>.yaml` via `cat_file`, which returns 1 on a read error.
  - `find` tries an exact `kuda_query::find` and falls back to `kuda_query::search`, tagging fuzzy hits with ` (fuzzy)`. In multi-root mode, hits and `refs` output are tagged with `repo_tag(root)`. `find` returns 1 when there are no hits.
  - `dependents` collects edges across roots and prints `from --kind--> to`. It returns 0 even when nothing depends on the name.
  - `refs`:
  - It is a textual line scan of files with fixed extensions (`md`, `mdx`, `rst`, `txt` with `--docs`, a wider list otherwise).
  - It skips `.git`, `target`, `node_modules` and `.kuda`.
  - Without `--docs` it first tries LSP references if `lsp` is in `extract.kinds` and `lsp_server` is set. It returns after the LSP step if that finds hits.
  - It returns 0 even when there are no mentions.
  - `mcp` is a line-delimited JSON-RPC 2.0 stdio server (protocol `2024-11-05`) with tools `repo_card`, `module_card`, `find`, `dependents`, `status`, `refs`. Notifications are ignored.
  - `acp` is a minimal ACP agent over stdio (protocolVersion 1). `session/new` always returns `sessionId` `"kuda-default"`. `session/prompt` streams one `agent_message_chunk` and then replies `end_turn`. `acp_answer` handles verbs `find`, `dependents`/`deps` and `card`. Any other prompt, including `map` and `status`, returns the L0 `index.yaml`.
  - `doctor` only prints the config load result and a hardcoded adapters line. It always returns 0.
  - `gen-cli-docs` prints `clap_markdown::help_markdown::<Cli>()`.
  - `e2e.rs` runs the binary through `CARGO_BIN_EXE_kuda`. `help_and_stub` checks that `--help` lists `init`, `sync`, `status`, `map`, `card`, `find`, `dependents`, `refs`, `mcp` and `doctor`. `init_scaffolds` runs `init` in a temp dir, checks `kuda.toml` and `.kuda/modules`, and expects a second `init` to exit 1.
  notes:
  - `help_and_stub` asserts that `kuda sync` in the system temp dir exits with code 2 ("stub exit code"). `sync` now returns `sync_one`'s codes, which are 0 or 1, and nothing in `sync` returns 2, so this assertion looks stale. Only `status` returns 2. I did not run the tests.
  - `status` and `sync` store `commit_sha` and write `meta.json` by hand-formatted JSON. `generated_at` is raw unix seconds and is not quoted in `meta.json`.
  - `status` ignores `--workspace`, because it only scans `<root>/.kuda/modules`. `card`, `map`, `mcp` and `acp` are also single-root.
  - `workspace` mode in `find`, `dependents` and `refs` opens each root's own store at `cfg.store.path`, using the config loaded from the current root.
  - `init` doesn't detect languages despite its help text ("Detect languages -> kuda.toml + .kuda/ scaffold"). It copies `EXAMPLE_TOML`.
  - `sync_one` uses `syms[0].file` as the card path. Each module's provenance covers only the files its symbols come from, not the module's other source files. Its provenance generator string is always `kuda-template/0.1.0`, even for ACP-written cards. The repo card uses `kuda/0.1.0`.
  - `hash_files` yields an empty string for a file that git can't hash, such as one outside a repo or untracked and missing. Drift detection then compares against that empty value.
  - `kuda_git::GitVcs.head_sha` failing gives the sha `"unknown"` in `sync_one`. `status` falls back to an empty string.
  - `doctor`'s adapters line is hardcoded text and says "llm pending". It doesn't probe adapters.
  - `mcp` and `acp` duplicate the find and dependents formatting code, as does `find` in the CLI.
