notes: |
  - `init` refuses to overwrite an existing `kuda.toml` (exit 1); on success writes `kuda.toml` from `EXAMPLE_TOML` plus `.kuda/` and `.kuda/modules/`, exit 0 (main.rs:160-179, asserted in e2e.rs `init_scaffolds`).
  - `--help` lists at least the subcommands init, sync, status, map, card, find, dependents, refs, mcp, doctor (e2e.rs `help_and_stub`); `sync` on an empty tmp dir exits with code 2.
  - Module card filenames are sanitized through `safe()`: non-`[A-Za-z0-9._-]` chars become `_` before writing/reading `.kuda/modules/<name>.yaml`.
  - Purpose fallback chain: manifest `description` (Cargo.toml `package.description` or package.json `description`) → first `//!` line of `src/lib.rs`/`src/main.rs` → first non-heading README line (module README, then root README).
  - `sync_one` skips summarization when the existing card's `provenance.hashes` match freshly computed `git hash-object` hashes of the module's files (incremental freshness); `status` compares the same hashes and reports fresh vs drifted.
  - Roots resolution: without `--workspace` it's just the config dir; with `--workspace`, roots come from `.kuda/workspace.yaml` `roots:` (resolved relative to that file's dir), falling back to the single dir if empty; multi-root output is tagged with `[<repo dir name>]`.

  - `--full` on `sync` is accepted but ignored (`_full` parameter — no full-rebuild path yet); `sync` always exits 0 unless card/store setup fails.
  - `load_config` swallows config errors: prints `config: ... — defaults in use` and proceeds with `Config::default()`; `doctor` also reports config health but always exits 0.
  - `hash_files` shells out to `git hash-object` per file and yields empty strings on failure (non-git dir), so hashes can silently be `""`.
  - `status` slices `head[..min(7)]` — safe for the empty string, but HEAD-less repos report an empty sha; a card whose file list length differs from recomputed hashes is always "drifted".
  - `find` falls back to fuzzy `kuda_query::search` and appends `" (fuzzy)"` to the module field; empty results exit 1 with "no symbol ... run `kuda sync`?".
  - `refs` tries LSP references first only when `lsp` is in `extract.kinds` and not `--docs`; otherwise a textual sweep that skips `.git`, `target`, `node_modules`, `.kuda` dirs.
  - `gen-cli-docs` is a hidden subcommand emitting markdown via `clap_markdown`; `mcp`/`acp` are minimal line-delimited JSON-RPC stdio servers.
  - `LANG_TOMLS` is embedded at compile time from `data/langs/{rust,typescript,python,go}.toml`; `EXAMPLE_TOML` from `examples/kuda.toml.example` — `langs()` silently drops any that fail to parse.
