notes: |
  - Every `Vcs` method returns `bool` (except `head_sha` → `Option<String>`): success = the git subprocess exited 0; spawn/status failures are `false`, and `head_sha` trims stdout and returns `None` on failure.
  - `git(repo, args)` always runs with `git -C <repo> ...`; `sync` = `fetch origin --prune`, `has_commit` = `cat-file -e <sha>`, `worktree_add` uses `--detach`, `worktree_remove` uses `--force`, `tag_exists` verifies `refs/tags/<tag>` via `rev-parse -q --verify`, `tag` = `git tag <tag>`, `push_tag` = `push origin <tag>`.
  - Only dependency is `kuda-vcs` (`.workspace = true`); the integration test `sync_has_commit_worktree_tag` builds a real temp repo (`git init -b main`, commit with `-c user.*`) and exercises has_commit/tag/worktree.
  - The test constructs a 40-zero sha and asserts `has_commit` is false — `cat-file -e` is used as the existence probe; `sync` (fetch origin) is not exercised in the test (no origin configured).
  - `worktree_add`/`remove` convert paths with `to_str().unwrap_or_default()`, so non-UTF-8 paths would become an empty arg; all errors are swallowed into `false` (no stderr surfaced).
