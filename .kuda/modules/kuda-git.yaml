notes: |
  - Every operation is total: failures (non-repo, bogus sha, no remote, git missing from PATH) return `false`/`None` — never panic or propagate errors (regression-tested).
  - Worktrees are added `--detach`ed at the given sha and removed with `--force`.
  - Child stdout/stderr are inherited rather than captured (except `head_sha`, which trims captured stdout), so git's own messages leak to the caller's terminal; `git()` collapses spawn errors and non-zero exits into one bool.
  - `sync` is just `fetch origin --prune` and `push_tag` pushes to `origin` — both fail (false) on repos without that remote; tags are checked via `rev-parse -q --verify refs/tags/<tag>`.
  - The test deliberately mutates `PATH` to simulate a missing git binary, which is why the whole suite is one test function (avoids env races with parallel test threads).
