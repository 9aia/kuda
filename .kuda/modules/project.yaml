notes: |
  - ADR-0001 fixes the architecture: tiered index (L0 repo card always-load, L1 module cards on-demand, L2 symbol/dep graph queried), every concern a port + adapter crates, per-language knowledge as data files, committed YAML cards vs gitignored rebuildable sqlite, and per-card provenance with `verify:` file lists — memory is an index into code, never a second source of truth.
  - Records use two frontmatter forms: `id = "..."` for ADRs and `item = "..."` for handoffs; tasks carry `T-NNN` ids referenced across TODO/BACKLOG/handoffs.
  - TODO items are unchecked checkboxes even where the code now exists (T-001–T-008 describe shipped crates) — the list reflects 0.1.0 planning, not live status; T-029 (domain descriptors + kuda-records) is marked claimed by devin, and T-025/T-026 are recovered-session/process items.
  - Dogfooding lessons are captured as tasks: T-009 (auto-gitignore `.kuda/index.sqlite` — mimus+bupha committed the binary by hand), T-011 (.hnl descriptor blocked on a tree-sitter-handl grammar), T-022 (index the ~70-repo handl-lang org as proving ground).
  - Deferred directions live in BACKLOG: embedding/RAG as a later `kuda-store` adapter (ADR-0001 option B), llm prose summarizer, watch daemon, episodic session memory, and the malurus critic that reuses kuda's query layer for claim verification.
  - T-027's handoff records the deck bugs as resolved upstream in slidev-theme-9aia (2a63bb8, e9b3cce), while TODO T-026 still tracks a failing deck verification — related but distinct work items.
