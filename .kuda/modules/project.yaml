notes: |
  - Records use stable ids in two formats — frontmatter (`id = "ADR-0001"`, `item = "T-027"`) and checklist lines (`- [ ] T-001`) — both captured by the same `record_patterns` regexes (capture group 1 = id).
  - ADR-0001 fixes the architecture: tiered memory (L0 repo card, L1 module cards, L2 symbol/dep graph), ports+adapters topology, per-language knowledge as data (`data/langs/*`), committed YAML cards but gitignored rebuildable sqlite, and per-card provenance with `verify:` file lists.
  - Cards are an index into code, never a second source of truth — staleness is a property of the data (sha/hash diff), not a promise in prose.

  - ADR numbering follows a meta counter, not file order — the domain-records ADR was filed as ADR-0003, not 0002 (per handoff T-029), so there is no 0002 file.
  - ADR-0003 (domain descriptors) is implemented on `feat/domain-records` (pushed b1927ee); deferred items are repo-local `[domains]` config, non-tree corpus sources (sturn refs/sqlite), and record→code-module edges.
  - `project/` is itself a git worktree (carries a `.git`-file marker); the records extractor walks declared corpus roots regardless, unlike the shared repo walk.
  - Several TODO items are already implemented in the codebase (e.g. T-019 `kuda watch`, T-024 release script, T-013 lsp adapter) though still listed open — the ledger's checkbox state is not a reliable freshness signal; cross-check against the code.
  - BACKLOG references sibling tools that compose through artifacts, not code deps: malurus (critic/claim-verification) and bupha (CI, dogfooded via modules/dagger).
