notes: |
  - Memory is an index into source, not a second source of truth; cards carry provenance and `verify:` file lists for source checking.
  - L0/L1 YAML cards are committed artifacts, while the rebuildable SQLite L2 graph is gitignored.
  - Extraction and summarization compose through ports and adapters, with deterministic template summarization as the default.
  - Language and domain knowledge lives in descriptors rather than engine-specific code.
  - Workspace record/code edges resolve across a logical union of modules while stores remain federated per repository root.
  - `TODO.md` is the 0.1.0 checklist and `BACKLOG.md` contains unscheduled 0.2+ ideas; unchecked historical items should not be treated as proof that corresponding code is absent.
  - Both ADRs are marked proposed/open even though ADR-0003 says its domain-records design was implemented on `feat/domain-records`.
  - ADR-0003 was numbered 0003 rather than 0002 because of the metadata counter, as recorded in archived handoff T-029.
  - T-029 leaves repo-local `[domains]` overrides, non-tree corpus sources, and record-to-module edges open; its addendum nevertheless documents org-name references converging with code dependencies.
  - Archived T-027 records upstream slide-theme fixes, while current T-026 still requires presentation verification and integration through the sturn flow.
  - The project index links ADR-0001 but not ADR-0003 or the archived handoffs.
