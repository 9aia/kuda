notes: |
  - Cards are committed artifacts (`.kuda/index.yaml`, `.kuda/modules/*.yaml`); `.kuda/index.sqlite` is gitignored and rebuildable — `kuda init`/`sync` must auto-append it to `.gitignore` (T-009).
  - Every card ends with a `verify:` file list and carries provenance `{files, content_hash, commit_sha}`; `kuda status` reports drift as a sha diff vs HEAD.
  - Per-language and per-domain knowledge is data (`data/langs/*`, `data/domains/*`), never extractor code — a new language/corpus is a descriptor change, not a release (ADR-0001, ADR-0003).
  - The `template` summarizer (zero-model, deterministic) is the default; LLM prose is an adapter behind the summarize port.
  - Engines compose through artifacts only — kuda has no code dependency on myco/sturn; the descriptor carries the format knowledge (ADR-0003).

  - No PRs in this repo: the pushed branch/commit is the deliverable (sturn flow); T-026's deck on `presentation/initial` (e1844e5) still fails verification and needs a repair/verify pass before merge.
  - T-028's agent-awareness block text is already deployed to the 6 `.kuda`-wired repos, but `kuda init` writing the `<!-- kuda:agent-awareness -->` block and freshness validation in `status`/`check` are still open.
  - Issue I-001: myco emits `priority=medium` but the CLI enum is `low|med|high|crit` — normalize the emitter to `med`; the kuda schema accepts both for now (visible in this corpus's own frontmatter).
  - T-025 is a recovered stale-claim task: `.kuda/modules/Cargo.toml.yaml` cites a missing `Cargo.toml`; recovered from dead sessions.
  - Record scan skips fenced code blocks so H1-looking `#` comments in samples don't become records; `ref_pattern` capture group 1 is the edge target (ADR-0003 addendum).
  - Workspace sync resolves edge targets against the union of all roots' modules; stores are federated per-root, merged at read time — the union graph is logical, not physical.
  - T-011 (.hnl descriptor) is blocked on a tree-sitter-handl grammar existing or being written; the descriptor itself is just data.
