purpose: Records extractor adapter (kind `"records"`) — turns non-code record corpora (tasks, ADRs, issues) into `SymbolKind::Record` symbols and `EdgeKind::References` edges, with all format knowledge living in `DomainDef` regex data rather than code. One per-line capture-group-1 scan covers both frontmatter (`id = "T-001"`) and checklist (`- [ ] T-001`) records.
