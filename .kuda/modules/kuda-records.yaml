purpose: 'I’ll verify the crate dependencies and complete extractor behavior, especially record scoping, frontmatter handling, and validation failure semantics, before producing the card.purpose: Implements the `records` extraction adapter, converting descriptor-driven non-code corpora into record symbols, reference edges, provenance files, and validation warnings. Supports regex-defined frontmatter and checklist records plus optional JSON Schema validation of TOML/YAML frontmatter. invariants: - Record IDs come from capture group 1 of per-line `record_patterns`; the first occurrence of each ID per file defines its one-based symbol location. - Record discovery skips fenced code blocks, while reference scanning uses the whole text for single-record files and only the record’s own line for multi-record files. - Reference targets use capture group 1 when present, otherwise the whole match, and edges have kind `References`. - Schema-invalid or unparseable frontmatter produces warnings without removing otherwise discoverable records. - Invalid descriptor regexes or schemas fail compilation loudly; absent corpus roots are silently skipped. notes: - `check` validates descriptor regexes and schemas without requiring corpus files; `validate` performs a full scan and returns only warnings without writing an index. - Only files under declared roots with declared extensions are scanned; configured and built-in directory exclusions still apply. - Declared corpus roots are descended into even when they contain a `.git` file marking a worktree. - Frontmatter must begin at the start of the file with `+++` for TOML or `---` for YAML; files without frontmatter skip schema validation without warning. - At most three schema error messages are included in a file’s combined warning. - Files with no discovered records are omitted from `Extraction.files`, even if schema validation examines them. - Reference self-edges are emitted here and expected to be removed downstream during sync.'
