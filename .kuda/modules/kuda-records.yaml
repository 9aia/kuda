notes: |
  - Reference-edge scope depends on record count: single-record files take edges from the whole text; multi-record files (checklists) scope each record's refs to its own line — otherwise every task would edge to every mentioned id.
  - Declared corpus roots are walked even when they carry a `.git`-file worktree marker (declaring the root is the intent — myco's `project/` is exactly such a worktree), unlike the shared repo walk.
  - A corpus root absent on disk is a silent skip, not an error; a bad regex in a descriptor is a hard compile error naming the domain and pattern.
  - First match wins per record id per file, and the symbol's line pins where the id first appears (1-based); one pattern match per line is enough (loop breaks).
  - Self-referencing edges ARE emitted here (e.g. ADR-0001 → ADR-0001) — sync's retain drops them downstream, so don't "fix" them at this layer.
  - Files with no record matches contribute nothing (not even to `Extraction.files`); only files matching the descriptor's extensions under declared roots are scanned, with `dir_excluded` (built-ins + `[extract] exclude`) applied to subdirectories.
  - `RecordsExtractor { excludes, domains }` ignores `LangDef`s entirely — adding a corpus is a new `data/domains/*` descriptor, not a code change.
