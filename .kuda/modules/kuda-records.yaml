notes: |
  - Record ids come from capture group 1 of the first matching record pattern on a line; the first occurrence of an id wins per file, and only one record pattern is tried per line.
  - Fenced code blocks delimited by lines whose trimmed start is ``` are skipped during record scanning.
  - Reference edges use capture group 1 when present, otherwise the whole match, and are always EdgeKind::References.
  - In multi-record files each record's refs are scanned only on its own line; single-record files scan the whole text, so self-edges can be emitted for downstream sync to drop.
  - Directory descent honors kuda_core::dir_excluded with the configured extra excludes, and a `.git` file does not stop the walk; files must match a declared extension after trimming a leading dot.

  - Unreadable directories/files and non-UTF-8 paths or contents are skipped rather than reported.
  - Files with no records contribute no symbols, edges, or out.files entry.
  - Symbol line numbers are 1-based and module is copied from DomainDef.module; the _langs extractor argument is unused.
  - Tests cover frontmatter/checklist extraction, worktree-root descent, whole-text versus same-line edge scope, capture-group ref targets, absent roots, and bad regex errors.
