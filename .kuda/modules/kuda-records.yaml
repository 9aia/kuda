name: kuda-records
path: crates/kuda-records/Cargo.toml
purpose: RecordsExtractor implements the "records" Extractor by compiling DomainDef record/ref regexes and recursively walking each declared corpus root to produce Record symbols and References edges from non-code files (frontmatter `id = "..."` and checklist `- [ ] ID` lines share one per-line capture-group-1 mechanism). Missing corpus roots are silently skipped, while invalid record or ref patterns return an error naming the domain and pattern.
