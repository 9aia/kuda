name: kuda-records
path: crates/kuda-records/Cargo.toml
purpose: The `records` extractor adapter — compiles `DomainDef` descriptor regexes into `SymbolKind::Record` symbols and `EdgeKind::References` edges for non-code corpora (tasks, ADRs, checklists), so a new corpus is a data change, not an engine change. Also exposes `check` (compile-only, for doctor) and `validate` (warnings-only scan, no index writes), with optional JSON-Schema validation of `+++` toml / `---` yaml frontmatter and a `file_records` mode that indexes binaries/images by path without reading text.
