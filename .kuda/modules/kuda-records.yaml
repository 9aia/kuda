notes: |
  - Record id is always regex capture group 1 of a `record_patterns` match; first match wins per id per file (`seen: HashSet`), and the symbol's `line` is the 1-based line of that first match.
  - Ref-edge scope: a file with exactly one record takes `ref_pattern` matches from the whole text; a multi-record ledger scopes each record's refs to its own line, so `- [ ] T-002 blocked on T-001` edges `T-002 -> T-001` without cross-wiring the file.
  - `ref_pattern` capture group 1 (when present) is the edge target — `"`(ident)`"` strips backticks; otherwise group 0 is used.
  - Fenced code blocks (``` delimiters) never produce records, but `ref_pattern` mentions inside them still produce edges.
  - A declared corpus root that doesn't exist on disk is a silent skip (empty `Extraction`), not an error; a bad regex or bad `schema_json` fails `compile` loudly with a `domain <name>: …` message.
  - Invalid records (schema violations, unparseable frontmatter) are still indexed as symbols — they exist — but each emits an `ExtractWarning`; files with no frontmatter skip schema validation silently (line-records can't be schema'd).
  - `walk_corpus` ignores `.git`-file worktree markers when descending declared roots (unlike the shared repo walk) — declaring the root is the intent (myco's `project/` is exactly such a worktree).
  - Self-edges (`from == to`) are emitted here and dropped downstream by sync's retain step, not by the extractor.

  - `Compiled` is built per `DomainDef` on every `extract` call — there is no caching across syncs; `check(def)` is just `compile(def).map(|_| ())`.
  - `validate` reuses the full extractor scan and discards everything but `warnings` — it does real file I/O, so `status`/`doctor` pay the same walk cost as a sync for the declared roots.
  - Schema validation errors are truncated to the first 3 messages per file (`iter_errors(...).take(3)`) and joined with `"; "` under a `"schema: "` prefix; unparseable frontmatter gets a `"frontmatter: "` prefix instead.
  - Extension matching strips a leading `.` from the descriptor's `extensions` entries and compares against `Path::extension` — so `".md"` and `"md"` both work, but the match is case-sensitive.
  - Only one `record_patterns` regex is tried per line (`break` after the first match) — order the patterns so the most specific wins; a line that could match two ids only yields the first.
  - `frontmatter` detects the dialect by the very first bytes of the file (`+++` vs `---`); a leading blank line or BOM defeats detection and the file is treated as having no frontmatter.
  - `Extractor::extract` ignores the `_langs` parameter entirely — records extraction is driven purely by `DomainDef`, independent of `data/langs/*`.
  - Dependencies are minimal and pinned: `jsonschema = "0.60.2"` plus workspace `regex`/`serde_json`/`serde_yaml`/`toml` and the `kuda-core`/`kuda-extract` traits — no async, no I/O crates beyond `std::fs`.
