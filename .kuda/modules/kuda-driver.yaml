notes: |
  - Query failures return `{"error": …}` payloads rather than crashing views; malformed wire requests and unknown operations receive structured error responses.
  - The driver never creates a missing SQLite index and resolves each request's repository from `root`/`dir`/`path`, `$KUDA_DRIVER_ROOT`, or the nearest indexed ancestor of the cwd.
  - View query bindings merge static parameters first and caller parameters second, so caller values override defaults.
  - The `find` view binds both exact and substring queries, but its `exact` form field is not interpreted by `run_query`; use the named `find` query for exact matching.
  - Symbol-list results are truncated to 200 rows without truncation metadata, and symbol graphs above 800 symbols return an error directing callers to module-level graphs.
  - Graphs omit self-edges and record-reference edges unless `records=true` or `all=true`; any `level` other than `symbols` selects the module graph.
  - Drift reporting recomputes per-card Git blob hashes but does not perform the CLI's repository-wide `tree_digest` check.
  - Missing or malformed configuration falls back to defaults, and unparseable module cards are skipped when building card lists.
