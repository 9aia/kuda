name: kuda-driver
path: crates/kuda-driver/Cargo.toml
purpose: tamias-driver-kuda is kuda's pavo view driver — it answers the pavo wire contract (manifest/views/view/query as ndjson JSON-RPC over stdio via pavo-driver-kit's serve loop) plus discovery verbs manifest/capabilities/ops/run, acts as the tamias bins[] shim via `cli` (stripping --dir/--name and re-execing kuda::run_from for full engine parity), and exposes engine ops as `cli.<verb>` wire queries that re-exec `run` in the request's repo so writes never touch the serve loop's ndjson stream.
