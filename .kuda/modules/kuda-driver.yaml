name: kuda-driver
path: crates/kuda-driver/Cargo.toml
purpose: '`kuda-driver` is `tamias-driver-kuda`, a pavo view driver answering wire ops (`manifest`, `views`, `view`, `query`) as ndjson JSON-RPC over stdio via `pavo-driver-kit`, with plain-argv discovery (`manifest`/`capabilities`/`ops`) and engine passthrough (`run` re-execs `kuda::run_from`). Views `map`, `modules`, `module`, `graph`, `drift`, `find` are backed by read-only queries over `IndexStore`/sqlite and committed `.kuda/` cards with drift recomputation, while feature-gated `cli`/`mcp` surfaces expose engine ops as a generated clap CLI or MCP tools.'
