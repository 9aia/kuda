purpose: '`kuda-cards` renders and parses the committed YAML card artifacts — `RepoCard` ↔ `.kuda/index.yaml` (the L0 always-load artifact) and `ModuleCard` ↔ `.kuda/modules/<name>.yaml` (L1 cards) — via serde_yaml round-trips that preserve machine fields and the human-owned `notes:` region.'
