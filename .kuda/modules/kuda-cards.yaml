purpose: '`kuda-cards` is the committed-artifact render layer: `render_repo_card`/`parse_repo_card`, `render_module_card`/`parse_module_card`, and `render_file_card`/`parse_file_card` round-trip `RepoCard`, `ModuleCard`, and `FileCard` domain types to/from `.kuda/*.yaml` via serde_yaml, while `carry_notes` preserves the human-owned `notes:` region across regeneration so machine field updates never overwrite human prose.'
