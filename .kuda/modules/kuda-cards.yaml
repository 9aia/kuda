purpose: '`kuda-cards` serializes and parses the repo memory index''s committed YAML artifacts, mapping `kuda_core` domain types (`RepoCard`, `ModuleCard`, `FileCard`) to and from text via serde_yaml. It renders the L0 always-load `.kuda/index.yaml`, L1 `.kuda/modules/<name>.yaml`, and L1.5 `.kuda/files/<module>/<file>.yaml` artifacts, with matching parse functions for round-tripping machine fields and the human-owned `notes:` region.'
