purpose: 'I’ll inspect the card renderer/parser implementation and manifest to capture serialization rules, compatibility behavior, and human-note preservation accurately.purpose: Serializes and deserializes kuda’s committed L0 repository, L1 module, and L1 per-file cards as YAML. Provides thin `serde_yaml` adapters for `.kuda/index.yaml`, `.kuda/modules/<name>.yaml`, and `.kuda/files/<module>/<file>.yaml`. invariants: - Machine fields and the human-owned module `notes` region round-trip through rendering and parsing. - Parse failures are returned as `Err(String)` rather than panicking. notes: - This crate performs no filesystem I/O, card-path sanitization, schema migration, or freshness validation; callers supply paths and card text. - Serialization structure and defaults are inherited from the `kuda-core` card types and Serde, not defined independently here. - Tests cover round-trips for all three card types, omitted API counts, symbol kinds, notes, and rejection of malformed or structurally invalid YAML.'
