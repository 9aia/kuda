notes: |
  - Every render/parse function pair is a pure serde_yaml `to_string`/`from_str` round-trip, mapping serde errors to `String`.

  - Depends only on `kuda-core`, `serde = "1"`, and `serde_yaml = "0.9"` (note: serde_yaml is deprecated upstream, but 0.9 is pinned here).
  - File layout conventions (`.kuda/index.yaml`, `.kuda/modules/<name>.yaml`, `.kuda/files/<module>/<file>.yaml`) are documented only in doc comments, not enforced by the code.
