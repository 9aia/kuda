notes: |
  - Machine fields and the human-owned `notes:` region must round-trip through render/parse unchanged (regression-tested: `api_omitted`, symbol kinds, and notes survive).
  - Parsers reject malformed or wrong-shaped YAML (e.g. `:::`, a bare list for a `FileCard`) with an `Err`, never a panic or silent default.
  - Artifact layout is fixed by convention: `.kuda/index.yaml` is the L0 always-load repo card, `.kuda/modules/<name>.yaml` the L1 module cards, `.kuda/files/<module>/<file>.yaml` the L1 per-file cards.
  - The crate is a pure pass-through — no validation, defaults, or migration logic; all schema knowledge lives in the kuda-core types' serde derives.
