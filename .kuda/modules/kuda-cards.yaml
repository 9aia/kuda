notes: |
  - All four functions are thin serde_yaml wrappers: `render_*` = `serde_yaml::to_string`, `parse_*` = `serde_yaml::from_str`, each mapping errors to `String` via `e.to_string()`.
  - Types come from `kuda-core` (`ModuleCard`, `RepoCard`); the crate's only other deps are `serde = "1"` and `serde_yaml = "0.9"` (note: direct semver ranges, not `.workspace = true`).
  - No validation or normalization beyond serde — a parse failure returns the serde error string; round-trip fidelity depends entirely on `kuda-core`'s serde attributes on the card types.
