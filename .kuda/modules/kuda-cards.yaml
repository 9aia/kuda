notes: |-
  invariants:
  - The four public functions are `render_repo_card`, `parse_repo_card`, `render_module_card` and `parse_module_card`. Each is a one-line wrapper over `serde_yaml::to_string` or `serde_yaml::from_str`.
  - Every function returns `Result<_, String>`. Errors are the `serde_yaml` error converted with `e.to_string()`.
  - Rendering and parsing both come from the serde derives on the `kuda_core` types, so the YAML shape is defined in `kuda-core`, not here. The crate doc says machine fields and the human-owned `notes:` region round-trip through these functions.
  - Dependencies are `kuda-core` (workspace), `serde` 1 and `serde_yaml` 0.9. `serde` and `serde_yaml` are pinned directly in this crate's `Cargo.toml` rather than through `workspace = true`.
  notes:
  - The crate does no file I/O and no path handling. Callers choose where `.kuda/index.yaml` and `.kuda/modules/<name>.yaml` are read from and written to.
  - This crate has no validation, no schema versioning and no merge logic. Round-tripping `notes:` depends entirely on `ModuleCard` serializing it, and nothing here preserves YAML comments or key order beyond what `serde_yaml` does.
  - `lib.rs` has no tests.
