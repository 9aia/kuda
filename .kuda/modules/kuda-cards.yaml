notes: |
  - Round-trip must preserve both machine fields and the human-owned `notes:` region — the module docs state this is the contract of these functions.

  - All six functions are thin `serde_yaml` wrappers that map errors to `String` — no validation or transformation logic lives here, so malformed YAML surfaces only as a parse error string.
  - The three card levels map to distinct artifact paths: `.kuda/index.yaml` (L0, always-load), `.kuda/modules/<name>.yaml` (L1), and `.kuda/files/<module>/<file>.yaml` (L1.5).
