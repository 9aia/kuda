purpose: kuda-secret defines the `Secrets` port — a `Send + Sync` trait with `get(&self, name) -> Option<String>` (absence is not an error; callers try the next store in the chain) and `set(&self, name, value) -> std::io::Result<()>` for deploy-time persistence. Implementations live in adapter crates (`kuda-keyring` via `secret-tool`, `kuda-dotenv` via KEY=VAL files), not in this crate.
