notes: |
  - `get` returns `Option<String>`: `None` means "not here" and is NOT an error — the caller tries the next store in the chain.
  - `set` returns `std::io::Result<()>`: stores that can't write return an error (write is for deploy-time migration, not a guaranteed capability).
  - Implementors must be `Send + Sync`.
  - Implementations are `kuda-keyring` (OS keyring) and `kuda-dotenv` (KEY=VAL file); the chain ordering/fallback logic lives in the caller, not in this crate.
