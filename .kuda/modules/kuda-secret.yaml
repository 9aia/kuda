notes: |
  - `Secrets: Send + Sync` with exactly two methods: `fn get(&self, name: &str) -> Option<String>` and `fn set(&self, name: &str, value: &str) -> std::io::Result<()>`.
  - `get` returning `None` means "not here" — the caller tries the next store in the chain; it is never an error (missing is not an error).
  - `set` persists a value (deploy-time migration); stores that can't write return an `io::Error`.
  - The crate has **no dependencies** (`[dependencies]` is empty) — it's a pure port.
  - Chain-order semantics live in the caller, not here: keyring misses (headless/no-dbus) fall through to the dotenv file store by contract.
