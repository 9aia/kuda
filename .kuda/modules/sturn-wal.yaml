  - The ref's head sha is the module input's content hash, so a moved ref diffs exactly like a file write and incremental sync consumes each op exactly once.
  - This is the first non-filesystem domain source (`DomainDef.source` = `sturn-wal`, descriptor `data/domains/sturn.toml`); the ref is read as a virtual JSONL file — one event per line, the ref name as `Symbol.file`, the event position as `Symbol.line`.
