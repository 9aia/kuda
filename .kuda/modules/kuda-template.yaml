notes: |
  - Card `api` contains only symbols whose `module` matches the requested module.
  - Card `deps` contains targets only from edges whose `from` matches the requested module.
  - `verify` copies the extraction’s file list and `provenance` is passed through unchanged.
  - The initial `purpose` is simply the module name; callers apply manifest, README, or documentation fallbacks.
  - `api_omitted` is always zero, and `warnings` and `notes` are initialized empty.
  - Dependencies are collected without filtering, deduplication, or sorting in this adapter.
  - The implementation performs no model calls or filesystem access and always returns `Ok` for the constructed card.
  - Agent-written prose belongs to the ACP adapter; the direct LLM path is parked.
