notes: |
  - `TemplateSummarizer` implements `Summarizer` with `kind() == "template"` and always returns `Ok` (infallible construction).
  - Card fields: `name`/`purpose` = the `module` string, `path` = the passed path, `api` = `ext.symbols` filtered to `s.module == module` (cloned), `deps` = `ext.edges` where `e.from == module` mapped to `e.to`, `notes` = empty string, `verify` = `ext.files` cloned, `provenance` = the caller-supplied `prov` passed through untouched.
  - Only dependencies are `kuda-core`, `kuda-extract`, `kuda-summarize` (all `.workspace = true`).
  - The doc says `purpose` is "the first doc line when a module manifest/README supplies one, else the module name" — but this adapter hardcodes `purpose: module`; the manifest/README fallback is applied by the caller (`kuda-cli`'s `module_purpose`, only when `card.purpose == card.name`).
