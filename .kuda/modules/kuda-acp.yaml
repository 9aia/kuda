name: kuda-acp
path: crates/kuda-acp/Cargo.toml
purpose: '`kuda-acp` is a summarizer adapter that spawns an external ACP agent binary (e.g. `cline --acp`, `zed agent`, `gemini --experimental-acp`) to write grounded module-card prose for the repo memory index — no API keys or provider lock, since auth lives in the user''s agent. It implements the `Summarizer` trait from `kuda-summarize`, using `kuda-core`''s `ModuleCard`/`Provenance` and `kuda-extract`''s `Extraction`.'
