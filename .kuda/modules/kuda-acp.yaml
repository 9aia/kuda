notes: |
  - Chain-of-thought must never reach the card: only `agent_message_chunk` text is collected; `agent_thought_chunk` updates are dropped.
  - Structured fields count only in the reply's FINAL block — the anchor is the LAST `purpose:` line, so a reasoning preamble (even one containing `purpose:`) never pollutes the card; with no `purpose:` anywhere, the last paragraph (not the first line) is used.
  - Agent→client requests must be answered or the prompt deadlocks: `session/request_permission` is granted its first option (default `allow_once`), unknown methods get JSON-RPC `-32601` method-not-found.
  - One agent session is lazily initialized (`initialize` + `session/new`) and reused across all modules behind a `Mutex`; missing `sessionId` falls back to `"kuda-default"`.
  - The agent is spawned via `sh -c <cmd>` with stderr nulled; garbage/non-JSON lines and notifications are skipped while waiting for the matching reply id, and EOF on stdout or a JSON-RPC error response fails the request (fallback is the caller's job — construction only fails when there's nothing to say).
  - The prompt caps context at 30 symbols and 15 files and demands a closing `purpose:`/`invariants:`/`notes:` block with nothing after `notes:`.
  - Tests drive a python ndjson stub (`KUDA_STUB_MODE`: ok/error/perm/garbage/close/noids, plus `KUDA_STUB_PROSE`/`KUDA_STUB_THOUGHT`) and serialize env mutation with `ENV_LOCK`, keeping all stubbed flows in one test to avoid races.
