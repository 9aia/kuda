purpose: '`kuda-acp` is the Summarizer adapter that spawns a user-configured ACP agent binary (e.g. `cline --acp`, `zed agent`) over JSON-RPC to write grounded module-card prose, avoiding API keys or provider lock-in since auth lives in the user''s agent.'
