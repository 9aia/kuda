purpose: '`kuda-acp` provides `AcpSummarizer`, the `kuda-summarize` adapter (kind `"acp"`) that spawns any ACP-capable agent binary via `sh -c`, reuses one `session/prompt` session across all modules, and asks it to write grounded `purpose:`/`notes:` card prose from extracted symbols and files; only the reply''s final structured block counts, `agent_thought_chunk` is dropped, `session/request_permission` is auto-granted, and empty/monologue/unparseable replies fail so the caller falls back to the template summarizer — raw agent output never reaches a committed card.'
