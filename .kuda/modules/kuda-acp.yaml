name: kuda-acp
path: crates/kuda-acp/Cargo.toml
purpose: An ACP (Agent Client Protocol) summarizer adapter that spawns any client-capable agent binary (e.g. `cline --acp`, `zed agent`, `gemini --experimental-acp`) to write grounded module-card prose for the repo memory index — no API keys or provider lock-in, since auth lives in the user's agent. It implements the `kuda_summarize::Summarizer` trait and reuses a single lazy agent session across all modules.
