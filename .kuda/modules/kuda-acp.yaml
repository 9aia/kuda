notes: |
  - One agent session (client + sessionId) is lazily created on first `complete()` call and reused across all modules, guarded by a `Mutex`; `AcpClient::spawn` runs the command via `sh -c` with piped stdin/stdout and null stderr.
  - `request()` reads JSON lines until a reply matching its incrementing id, concatenating streamed `agent_message_chunk` text; JSON-RPC errors surface as `Err`.
  - `summarize()` parses only marked sections from the agent's reply: text before the `purpose:` line is ignored, `invariants:`/`notes:` sections feed the card's `notes`, and with no marked sections the first non-empty line becomes the purpose (falling back to the module name if prose is empty).
  - The constructed card's `api`, `deps`, and `verify` fields come from the `Extraction` (symbols, edge targets, files), not from agent prose.

  - `prompt_for()` truncates to 30 symbols and 15 source files in the prompt.
  - Module docs state construction only fails when there's nothing to say; fallback handling is the caller's responsibility.
  - `AcpClient` is private (only `AcpSummarizer` is public despite the spawn/send/request symbols); its `stderr` is discarded, which can hide agent startup errors.
