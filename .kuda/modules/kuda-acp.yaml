notes: |
  - Only `agent_message_chunk` text contributes to replies; `agent_thought_chunk` updates are discarded.
  - Structured card parsing starts at the final `purpose:` line so reasoning preambles cannot enter card fields.
  - Card `api`, `deps`, `verify`, and `provenance` come from extraction inputs rather than agent prose.
  - Agent permission requests are answered with the first option to prevent prompt deadlocks.
  - The configured command runs through `sh -c`; agent stderr is discarded.
  - A missing `sessionId` falls back to `kuda-default`.
  - If no `purpose:` field exists, the last paragraph becomes the purpose, with the module name as the final fallback.
  - Both `invariants:` and `notes:` content are flattened into the card’s single `notes` string.
  - Prompts include at most 30 symbol names and 15 source files, though the full extraction still populates mechanical card fields.
  - Protocol errors and closed agent stdout return errors; template fallback is the caller’s responsibility.
  - Tests require `python3` and serialize environment mutation with `ENV_LOCK`.
