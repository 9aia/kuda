notes: |
  - Every claim in generated card prose must be grounded — it is re-verified against the named source files.
  - The git token (if ever added here) must never persist in an image layer or cache — per this crate's sibling patterns, auth rewrites run inside exec, not in layers.

  - The private `AcpClient` speaks JSON-RPC over the agent's stdin/stdout; it auto-answers `session/request_permission` by granting the first option and replies method-not-found to unknown agent→client requests to avoid prompt deadlocks.
  - `AcpSummarizer::complete` lazily initializes the session on first call (holds a `Mutex<Option<(AcpClient, String)>>`); construction never spawns the agent, and it respawns on failure per the struct docs.
  - `summarize` parses the returned prose by marked sections only (`purpose:`/`invariants:`/`notes:`); anything before the `purpose:` line (e.g. thinking preamble) is ignored, and if no marked `purpose:` exists, the first non-empty line is used, ultimately falling back to the module name.
  - The prompt caps context at 30 public symbols and 15 source files (`prompt_for`), so large modules get a truncated view.
  - Fallback handling for a failed ACP summarizer is the caller's responsibility — this crate only errors "when there's nothing to say" per the module docs.
