purpose: 'purpose: Summarizer adapter that implements `kuda_summarize::Summarizer` as `AcpSummarizer`. It spawns an external ACP agent command (for example `cline --acp`) and talks to it over JSON-RPC on stdio, and the agent writes the prose for a `ModuleCard`. Auth stays in the user''s agent, so kuda holds no API keys.'
