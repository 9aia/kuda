purpose: Summarizer adapter (`AcpSummarizer`, kind `"acp"`) that spawns an ACP agent binary (zed, cline, gemini-cli…) over newline-delimited JSON-RPC on stdio to write grounded module-card prose — no API keys or provider lock, auth lives in the user's agent. Turns the streamed reply into a `ModuleCard` (purpose, notes, api/deps from the extraction, provenance passed through).
