purpose: '`kuda-query` is the thin query engine for kuda — the agent-facing read layer over `IndexStore` plus committed cards, where filtering/formatting lives in this crate and storage stays behind the port. It backs the `find`, `search`, `dependents`, `card`, and `status` CLI/MCP reads.'
