notes: |
  - `find`, `search`, `dependents`, `modules` are direct pass-throughs to the corresponding `IndexStore` methods with `Result<_, String>` errors propagated unchanged (`find` = exact symbol lookup, `search` = substring/fuzzy tier, `dependents` = reverse-dep impact analysis, `modules` = indexed module list).
  - `module_symbols(store, module)` = `store.find(module)` filtered to `s.module == module` (symbols the module owns).
  - Only dependencies are `kuda-core` and `kuda-store` (both `.workspace = true`).
  - `module_symbols` relies on `find(module)` returning enough matches to then filter by module name — the `chain(vec![])` is a no-op; if `find` is exact-name-only, a module whose symbol names differ from the module label may yield partial results.
