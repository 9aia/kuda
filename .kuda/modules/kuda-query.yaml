notes: |
  - `find` (exact symbol lookup), `search` (substring/fuzzy tier), `dependents` (reverse edges for impact analysis), and `modules` are pass-throughs to the `IndexStore` port — errors propagate as `Result<_, String>`.
  - `module_symbols` returns only symbols whose `module` field equals the queried module (it chains an empty vec as a no-op before filtering).

  - Takes `&dyn IndexStore`, so it's store-agnostic (works with the SQLite adapter or any other implementation).
  - Depends only on `kuda-core` and `kuda-store`; no file/YAML access — card prose is read elsewhere (e.g. CLI reads `.kuda/modules/<name>.yaml` directly).
