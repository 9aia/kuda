notes: |
  - `dependents` expands dash/underscore spellings via `module_variants` so `use foo_bar` edges answer `dependents foo-bar`, deduping identical (from, to, kind) rows reached through multiple spellings.
  - Self-edges never surface in `dependents` — dropped at read time by comparing `module_key(from) == module_key(to)`, defense-in-depth for indexes written before the write-time filter.
  - `edge_count == 0` means "no dep data", NOT "no dependents" — callers must report the difference honestly.
  - `module_symbols` is implemented as `store.find(module)` filtered by `s.module == module` — it finds symbols NAMED after the module (e.g. its module symbol), not a general per-module symbol listing.
  - All functions take `&dyn IndexStore` and propagate store errors as `String`; no caching or ranking is added at this layer.
