notes: |
  - `replace_module` and `record_files` are replace-per-module, each delete+insert in ONE transaction: re-replacing a module drops its old symbols/outgoing edges/file rows and leaves other modules untouched.
  - `search` escapes LIKE metachars (`\`, `%`, `_` with `ESCAPE '\'`) so user patterns stay literal substring matches.
  - Kind strings degrade tolerantly on read: unknown symbol kind → `Other`, unknown edge kind → `PackageDep` (forward-compat with older readers; corrupt rows never panic).
  - All store errors surface as `Err(String)` — dropped tables, unopenable paths, and non-sqlite files are errors, never panics (regression-tested).
  - `Connection` is `!Sync`, so the store wraps it in a `Mutex` to satisfy the port's `Send + Sync` bound — single-writer anyway; mutex poisoning becomes an error string.
  - Schema is `CREATE TABLE IF NOT EXISTS` on every open (symbols indexed by name+module, edges by to_mod, meta keyed, files keyed by path); parent dirs are created automatically.
  - `modules()` derives from DISTINCT symbol rows (a module with edges but no symbols won't list); `meta` maps `QueryReturnedNoRows` to `Ok(None)`; `set_meta` is an upsert.
  - `open` has `cfg(coverage)` variants for the parent-dir handling since `parent()` is only `None` for `/`-like paths, never a real store path.
