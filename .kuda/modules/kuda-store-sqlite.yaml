notes: |
  - `SqliteStore` wraps `rusqlite::Connection` in a `Mutex` because `Connection` is `!Sync` — this satisfies the port's `Send + Sync` bound; it's single-writer anyway. Every operation acquires the lock and maps errors to `String`.
  - `replace_module` runs in one transaction: `DELETE` the module's symbols and its outgoing edges (`from_mod = module`), then insert all new rows; `record_files` likewise deletes the module's `files` rows then re-inserts the full set.
  - Kind strings round-trip through `sk_str`/`sk_from` (lowercase, e.g. `function`, `trait`) and `ek_str`/`ek_from` (kebab-case: `imports`, `calls`, `package-dep`, `workspace-member`); unknown/missing strings decode to `SymbolKind::Other` / `EdgeKind::PackageDep`.
  - `search` is a case-sensitive `LIKE '%pattern%'` with `\` as ESCAPE — `%`, `_`, and `\` in user input are escaped so they match literally; results ordered by name.
  - `set_meta` upserts (`ON CONFLICT(k) DO UPDATE`); `meta` returns `Ok(None)` only for `QueryReturnedNoRows`, other errors propagate.

  - Depends on `rusqlite 0.32` with the `bundled` feature (SQLite compiled in — no system libsqlite required), plus `kuda-core` and `kuda-store`.
  - `file_hashes` returns a `HashMap<path, (hash, module)>` built from a full table scan; `files.path` is `PRIMARY KEY`, so a path can only belong to one row — a file appearing under two modules would collide.
  - `open` is idempotent-safe (`CREATE ... IF NOT EXISTS`), so re-opening an existing store preserves data.
