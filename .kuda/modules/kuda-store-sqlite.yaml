purpose: '`kuda-store-sqlite` is the SQLite adapter of kuda''s `IndexStore` port — a single, zero-server, rebuildable file (typically `.kuda/index.sqlite`) holding the L2 symbol/dep graph plus meta and per-file hash tables. `SqliteStore::open` creates parent dirs, opens the connection, and applies `SCHEMA` (tables `symbols`, `edges`, `meta`, `files`, with indexes on `symbols(name)`, `symbols(module)`, `edges(to_mod)`).'
