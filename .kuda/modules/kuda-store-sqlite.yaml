notes: |
  - `SqliteStore { conn: Mutex<Connection> }` (the mutex exists because `Connection` is `!Sync`, satisfying the port's `Send + Sync` bound; single-writer anyway); every trait method goes through `lock()` and maps errors to `String`.
  - `open(path)` creates parent dirs, opens the DB, and `execute_batch(SCHEMA)` — tables `symbols(name,kind,file,line,module)` + indexes on `name`/`module`, `edges(from_mod,to_mod,kind)` + index on `to_mod`, `meta(k PRIMARY KEY, v)`.
  - `replace_module(module, syms, edges)` runs in one transaction: `DELETE FROM symbols WHERE module=?` + `DELETE FROM edges WHERE from_mod=?`, then inserts all symbols and edges, then commits.
  - Kind mapping round-trips via `sk_str`/`sk_from` (function/type/trait/const/module/macro/other — unknown reads back as `Other`) and `ek_str`/`ek_from` (imports/calls/package-dep/workspace-member — unknown reads back as `PackageDep`).
  - Read semantics: `find` = exact `WHERE name = ?`; `search` = `LIKE %pattern% ESCAPE '\'` with `\`, `%`, `_` escaped (literal substring, `ORDER BY name`); `dependents` = `WHERE to_mod = ?`; `modules` = `SELECT DISTINCT module ... ORDER BY module`; `set_meta` = upsert `ON CONFLICT(k) DO UPDATE`; `meta` returns `Ok(None)` on `QueryReturnedNoRows`.
  - No tests ship with this crate; deps are `kuda-core`, `kuda-store` (workspace) + `rusqlite = "0.32"` with `bundled`.
  - `line` is stored as INTEGER (u32 fits), `file` via `to_string_lossy` (non-UTF-8 paths degrade); rows have no primary key — duplicates are only prevented by the delete-then-insert in `replace_module`.
  - A poisoned mutex (`lock()` err) surfaces as a plain `String` error like any DB failure — no distinction.
