notes: |
  - `replace_module` and `record_files` are transactional delete-then-insert scoped to one module — re-syncing a module fully replaces its symbols/edges/file-hashes rather than appending (verified by `replace_module_replaces` and the re-record case in `meta_and_file_hashes`).
  - `SymbolKind`/`EdgeKind` persist as strings with fallback arms: unknown symbol kind → `Other`, unknown edge kind → `PackageDep` (exercised by inserting bogus kind strings in `all_kinds_roundtrip`).
  - `search` escapes LIKE metachars (`\`, `%`, `_`) so user text stays literal.
  - `set_meta` is an upsert (`ON CONFLICT(k) DO UPDATE`); `meta` returns `None` on no-rows rather than erroring.

  - `Connection` is `!Sync`, hence the `Mutex` — the store is single-writer anyway; the lock is also what lets tests drop tables out from under the store to exercise error paths.
  - `open` creates parent dirs and runs the idempotent `CREATE TABLE IF NOT EXISTS` schema; it errors if the parent is a file, the path is a directory, or the file is non-sqlite garbage (covered by `open_error_paths`).
  - `dependents` only matches `edges.to_mod = ?1` exactly — dash/underscore canonicalization is the caller's job (`module_variants` in kuda-core), not the store's.
  - `modules()` derives from `DISTINCT module FROM symbols`, so a module with edges but zero symbols won't appear in the module list.
  - Uses `rusqlite` with the `bundled` feature, so no system sqlite is required.
