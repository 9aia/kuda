notes: |
  - All methods report success as `bool` (`head_sha` as `Option<String>`) — never errors; the CALLER decides whether a failure is retryable (fetch-miss) or fatal.
  - Worktrees are detached at a given sha; `worktree_remove` is best-effort (false on failure) and `worktree_prune` GCs stale administrative entries.
  - Implementors are `Send + Sync`.
  - `sync` exists so a requested sha can resolve afterwards (fetch + prune remotes); `head_sha` is the provenance anchor for cards.
  - The git adapter is `kuda-git`; jj/hg support would be new adapter crates behind this same trait.
