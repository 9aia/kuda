purpose: '`kuda-vcs` is the VCS port for kuda — the `Vcs` trait covering the operations the watcher and release flow need (fetch, HEAD sha, object existence, detached worktrees, tags), with the git implementation in `kuda-git` and jj/hg as future adapter crates.'
