notes: |
  - `Vcs: Send + Sync`; all methods return `bool` success — callers decide whether a failure is retryable (fetch-miss) or fatal — except `head_sha(&self, repo) -> Option<String>` (the provenance anchor, `None` on failure).
  - Nine operations: `sync(repo)` (fetch + prune remotes so a sha can resolve), `has_commit(repo, sha)` (object existence after a sync attempt), `worktree_add(repo, dir, sha)` (detached worktree), `worktree_remove(repo, dir)` (best-effort, false on failure), `worktree_prune(repo)` (GC stale admin entries), `tag_exists(repo, tag)` (local), `tag(repo, tag)` (create, false on failure), `push_tag(repo, tag)` (to remote).
  - The crate has **no dependencies** (`[dependencies]` is empty) — a pure port using only `std::path::Path`.
  - Contract asymmetry to remember: `head_sha` is `Option<String>` while every other op is `bool`; `has_commit` assumes a prior `sync` attempt by the caller (the trait doc says "after a sync attempt").
