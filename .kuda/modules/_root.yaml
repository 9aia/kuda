notes: |
  - `extract()` locates the `_SELF_PATCH_PY` assignment and returns the `<<'PYEOF' ... PYEOF` heredoc body; it asserts if either is absent.
  - `run()` asserts exit code 0; `run_raw()` returns the raw `CompletedProcess` for failure assertions.
  - The generated patch block is idempotent (exactly one `[patch."` block after rerun), rows use `../<repo>/<crate>` paths, stale rows/comments inside the old block are stripped while comments outside and later tables survive, and `patch_host` overrides the `repository` field as `host + repo name`.
  - Missing both `repository` and `patch_host` must fail with "no patch_host" in stderr; every Load name in a public function must be a param, local, module global, or builtin.
  - Substitution is naive `str.replace` on `REPO_DIR`, `REPO_NAME`, `__PATCH_HOST__` — `REPO_DIR` replacement happens first, so a path containing those tokens would be mangled (unlikely in fixtures).
  - `run_raw()` always substitutes `__PATCH_HOST__` with `""`; only `run()` can pass a patch host.
  - `make_repo()` creates `crates/foo`, `crates/bar`, `modules/baz` with trivial `Cargo.toml`s but no root `Cargo.toml` — tests write that themselves.
  - `test_no_public_fn_forwards_undeclared_names` hardcodes an allowlist (`dagger`, `dag`, `function`, etc.); adding new module-level imports to `main.py` requires updating it.
  - `MAIN` resolves to `dagger/src/kuda/main.py` relative to the test file's parent's parent, so the test file must stay under `modules/dagger/tests/`.
