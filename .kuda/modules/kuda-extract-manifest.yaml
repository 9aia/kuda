name: kuda-extract-manifest
path: crates/kuda-extract-manifest/Cargo.toml
purpose: 'kuda-extract-manifest is kuda''s manifest adapter for extraction: ManifestExtractor walks a tree, matches manifest basenames declared by LangDef entries (Cargo.toml, package.json, pyproject.toml, setup.py, go.mod), parses each into a module Symbol plus PackageDep edges, skips excluded dirs and .git-as-file worktrees, and resolves Cargo git deps to the URL''s repo basename when resolve_git_deps is enabled.'
