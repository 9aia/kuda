notes: |
  - Module identity comes from the manifest's package name when present; otherwise it falls back to the parent directory name, then the manifest basename — a symbol is always emitted even for invalid/empty manifests.
  - Format detection is by filename (`parse_manifest` matches the basename); unknown basenames and unparseable bodies yield `(None, [])` rather than an error — extraction never fails on a bad manifest.
  - The walk skips noise dirs via `kuda_core::dir_excluded` (built-ins + `[extract] exclude`) and skips mounted git worktrees (a `.git` *file*, not a dir).
  - Cargo dep naming (`cargo_dep_name`): a `package = "real"` rename always wins (with or without `git`, and not gated by the flag); when `resolve_git_deps` is on and the entry isn't `workspace = true`, a `git = "<url>"` source resolves to the URL's repo basename (last path segment minus `.git`, trailing slashes trimmed) so the edge lands on a sibling repo module; plain/`workspace`/`path` deps keep the table key. Reads `dependencies`, `dev-dependencies`, and `build-dependencies`.
  - `resolve_git_deps` comes from `[workspace] resolve_git_deps`; `excludes` from `[extract] exclude`.
  - pyproject handles PEP 621 (`dependencies` array + `optional-dependencies` table), Poetry (`[tool.poetry.dependencies]`/`dev-dependencies`/`group.*.dependencies`, skipping the `python` key), and PEP 735/uv `[dependency-groups]`; PEP 508 requirement strings are reduced to the bare name via `pep508_name` (strips extras, version markers, `;` constraints).
  - `setup.py` only scans for the `name=` kwarg (deps live in code, not data) — the package name alone establishes module identity.
  - `go.mod` takes the `module ` line as the name and tab-indented lines containing `" v"` (require entries) as deps; `package.json` reads `dependencies` + `devDependencies` keys.
