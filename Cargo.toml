[workspace]
resolver = "2"
members = [
    "crates/kuda-cli",
    "crates/kuda-core",
    "crates/kuda-extract",
    "crates/kuda-extract-manifest",
    "crates/kuda-extract-treesitter",
    "crates/kuda-extract-lsp",
    "crates/kuda-records",
    "crates/kuda-acp",
    "crates/kuda-store",
    "crates/kuda-store-sqlite",
    "crates/kuda-summarize",
    "crates/kuda-template",
    "crates/kuda-query",
    "crates/kuda-cards",
    "crates/kuda-config",
    "crates/kuda-driver",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/kuda"
description = "Code-map engine — verified per-module cards agents read before code"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
kuda = { path = "crates/kuda-cli", version = "0.3.0" }
kuda-core = { path = "crates/kuda-core", version = "0.3.0" }
kuda-extract = { path = "crates/kuda-extract", version = "0.3.0" }
kuda-extract-manifest = { path = "crates/kuda-extract-manifest", version = "0.3.0" }
kuda-extract-treesitter = { path = "crates/kuda-extract-treesitter", version = "0.3.0" }
kuda-extract-lsp = { path = "crates/kuda-extract-lsp", version = "0.3.0" }
kuda-records = { path = "crates/kuda-records", version = "0.3.0" }
kuda-acp = { path = "crates/kuda-acp", version = "0.3.0" }
kuda-store = { path = "crates/kuda-store", version = "0.3.0" }
kuda-store-sqlite = { path = "crates/kuda-store-sqlite", version = "0.3.0" }
kuda-summarize = { path = "crates/kuda-summarize", version = "0.3.0" }
kuda-template = { path = "crates/kuda-template", version = "0.3.0" }
kuda-query = { path = "crates/kuda-query", version = "0.3.0" }
kuda-cards = { path = "crates/kuda-cards", version = "0.3.0" }
lasius-vcs = { git = "ssh://git@github.com/9aia/lasius.git", rev = "351857536395951d5f6f8502cdaf86a737520b02" }
lasius-vcs-git = { git = "ssh://git@github.com/9aia/lasius.git", rev = "351857536395951d5f6f8502cdaf86a737520b02" }
kuda-config = { path = "crates/kuda-config", version = "0.3.0" }
kuda-driver = { path = "crates/kuda-driver", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
scarab-config-file = { git = "ssh://git@github.com/9aia/scarab.git", rev = "9364df88fad0ca46bd838467717a823893f47438", version = "0.1" }
sepia-acp = { git = "ssh://git@github.com/9aia/sepia.git", rev = "c6f66e48050a76e24f4149438d6c20ab21bbbd91", version = "0.2.0" }
regex = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
