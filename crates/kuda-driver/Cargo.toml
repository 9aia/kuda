[package]
name = "kuda-driver"
description = "tamias-driver-kuda — pavo view driver over a kuda index (ViewNode IR) plus engine ops dispatching to the kuda lib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["kuda", "pavo", "driver", "visualization"]
categories = ["development-tools"]

[[bin]]
name = "tamias-driver-kuda"
path = "src/main.rs"

[features]
# `mcp` embeds pavo-driver-kit's surface layer — the `mcp` argv verb
# serves this driver's ops manifest as MCP tools on stdio, equivalent
# to a standalone surface driver minus the PATH/discovery hop.
# (`cli` is NOT a feature: it's the tamias `bins[]` shim verb — an
# engine passthrough that needs nothing optional. `watch`/`acp` ride
# the same shim with inherited stdio.)
# default = view driver + `ops` manifest + `run`/`cli` passthroughs.
default = []
mcp = ["pavo-driver-kit/mcp"]

[dependencies]
kuda.workspace = true
kuda-core.workspace = true
kuda-cards.workspace = true
kuda-store.workspace = true
kuda-store-sqlite.workspace = true
kuda-query.workspace = true
lasius-vcs.workspace = true
lasius-vcs-git.workspace = true
serde.workspace = true
serde_json.workspace = true
kuda-config.workspace = true
sha1 = "0.11.0"
# The ops manifest derives from the engine's clap tree
# (`kuda::command`) — Arg/Command introspection for param typing.
clap.workspace = true
# pavo driver-authoring kit — ndjson serve loop + manifest/ViewNode
# builders over pavo-protocol types. Git deps, not path: a fresh kuda
# clone has no sibling ../pavo checkout and CI (coverage.sh) must
# still resolve.
pavo-driver-kit = { git = "https://github.com/9aia/pavo", version = "0.1.0" }
pavo-protocol = { git = "https://github.com/9aia/pavo", version = "0.1.0" }

[dev-dependencies]
# Conformance gate — the wire-contract suite lives in pavo-testkit.
pavo-testkit = { git = "https://github.com/9aia/pavo" }
