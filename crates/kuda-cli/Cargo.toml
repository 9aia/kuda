[package]
name = "kuda"
description = "kuda — a hippocampus for your codebase: repo memory CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["code-intelligence", "kuda"]
categories = ["development-tools"]

[[bin]]
name = "kuda"
path = "src/main.rs"

[dependencies]
kuda-core.workspace = true
kuda-extract.workspace = true
kuda-manifest.workspace = true
kuda-treesitter.workspace = true
kuda-lsp.workspace = true
kuda-acp.workspace = true
kuda-store.workspace = true
kuda-store-sqlite.workspace = true
kuda-summarize.workspace = true
kuda-template.workspace = true
kuda-query.workspace = true
kuda-cards.workspace = true
kuda-vcs.workspace = true
kuda-git.workspace = true
kuda-config.workspace = true
kuda-config-toml.workspace = true
clap.workspace = true
toml.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
clap-markdown = "0.1.5"
text-splitter = { version = "0.28.0", features = ["code", "markdown"] }
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
sha1 = "0.11.0"
