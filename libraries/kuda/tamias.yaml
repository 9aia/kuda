# kuda — the code-map engine as a tamias package (T-012: the
# replication of the cuora P-023 pilot — a real product CLI riding
# `bins[]`, no hand-rolled binary).
#
# `scripts/pack.sh` release-builds `tamias-driver-kuda` into
# `drivers/bin/<host-triple>/` (gitignored — a build artifact) and
# this manifest ships it as a bundled driver. `tamias install
# ./libraries/kuda` (or the packed `.tgz` / a registry ref)
# registers the driver into `<tamias-home>/drivers/` and deploys the
# `kuda` bin below by default.
#
# The `kuda` shim is a generated script → `tamias bin exec` →
# `tamias-driver-kuda cli --dir <pkg> --name kuda <argv>` → the
# kuda engine lib's `run_from` in-process with inherited stdio.
# That is full argv parity with the retired `kuda` binary:
# `--help`/`--version`, globals before the verb (`--config`/
# `--workspace`), the unbounded `watch`/`mcp`/`acp` surfaces, and
# every bounded verb (`sync`/`status`/`map`/`card`/`find`/
# `dependents`/`refs`/`doctor`) stream end-to-end. No `tools/bin/`
# payload bin: the surfaces are verbs, not second binaries — they
# ride the same shim.
name: kuda
version: "0.1.0"
type: files
description: >-
  Code-map engine — verified per-module cards agents read before
  code. Every verb rides the tamias-driver-kuda engine passthrough;
  `kuda watch`/`mcp`/`acp` are the streaming surfaces.

bins:
  - name: kuda
    shim: cli
    driver: kuda
