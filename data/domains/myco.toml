# Domain descriptor — a corpus is data, not code (ADR-0003).
# myco's `project/` worktree: tasks, ADRs, issues, plans, handoffs.
name = "myco"
roots = ["project"]
extensions = [".md"]
module = "project"
purpose = "myco work ledger — tasks, ADRs, issues, plans, handoffs"

# Record ids — capture group 1, first match per id per file.
record_patterns = [
  # frontmatter: id = "ADR-0001" / item = "T-027"
  "(?:id|item)\\s*=\\s*\"([A-Z]+-[0-9]+)\"",
  # ledger lines: "- [ ] T-001" (TODO) and "- T-013" (BACKLOG)
  "-\\s*(?:\\[[ xX]\\]\\s*)?([A-Z]+-[0-9]+)",
]

# Reference edges — id mentions plus org engine names (data-tuned:
# tasks naming a crate edge to its module — "which tasks touch
# kuda-store"). Single-record files scan the whole text;
# multi-record files (ledgers) scope to the record's own line.
ref_pattern = "\\b[A-Z]+-[0-9]+\\b|\\b(?:kuda|myco|mimus|sturn|arca|cuora|bupha|peregrin|malurus)[a-z0-9-]*\\b"

# JSON Schema (draft 2020-12) — frontmatter-bearing records must
# carry `id` or `item`; status/priority are enum'd when present.
# Invalid records stay indexed but land as card warnings.
# priority accepts both `med` and `medium` — myco's CLI says med
# but its emitter writes medium (I-001 filed upstream).
schema_json = '''
{
  "anyOf": [{"required": ["id"]}, {"required": ["item"]}],
  "properties": {
    "id":       {"type": "string", "pattern": "^[A-Z]+-[0-9]+$"},
    "item":     {"type": "string", "pattern": "^[A-Z]+-[0-9]+$"},
    "title":    {"type": "string"},
    "status":   {"enum": ["open", "proposed", "claimed", "in-progress",
                          "blocked", "deferred", "done", "resolved", "closed"]},
    "priority": {"enum": ["low", "med", "medium", "high", "crit"]},
    "owner":    {"type": "string"},
    "epic":     {"type": "string"},
    "milestone": {"type": "string"}
  }
}
'''
