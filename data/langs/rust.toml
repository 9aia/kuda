# Language descriptor — data, not code (ADR-0001).
name = "rust"
extensions = [".rs"]
manifests = ["Cargo.toml"]
grammar = "rust"
# Captures are @name.<kind> — <kind> maps to SymbolKind.
symbol_query = '''
(function_item name: (identifier) @name.function)
(struct_item name: (type_identifier) @name.type)
(enum_item name: (type_identifier) @name.type)
(trait_item name: (type_identifier) @name.trait)
(const_item name: (identifier) @name.const)
(static_item name: (identifier) @name.const)
(mod_item name: (identifier) @name.module)
(macro_definition name: (identifier) @name.macro)
(type_item name: (type_identifier) @name.type)
'''

dep_query = """
(use_declaration argument: (identifier) @dep)
(use_declaration argument: (scoped_identifier path: (identifier) @dep))
(use_declaration argument: (scoped_use_list path: (identifier) @dep))
"""
